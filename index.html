<style>
/* ============================================================
   CSS DESIGN SYSTEM — VedaVPN v2.0.0
   ============================================================ */

/* ---------- Core token palette ---------- */
:root{
  --bg:          #080D18;
  --panel:       #0F1A2E;
  --panel-2:     #182340;
  --line:        #243050;
  --signal:      #39FF9E;
  --signal-rgb:  57,255,158;
  --signal-dim:  #1D9B62;
  --accent:      #6EA8FE;
  --accent-rgb:  110,168,254;
  --text:        #EDF1F7;
  --muted:       #7A879C;

  /* Glassmorphism */
  --glass:       rgba(12, 22, 42, 0.55);
  --glass-light: rgba(255,255,255,0.04);
  --glass-border:rgba(255,255,255,0.07);
  --blur:        blur(18px);
  --blur-sm:     blur(10px);

  /* Glow levels */
  --glow-xs:     0 0 12px rgba(var(--signal-rgb),.25);
  --glow-sm:     0 0 24px rgba(var(--signal-rgb),.35);
  --glow-md:     0 0 48px rgba(var(--signal-rgb),.45);
  --glow-lg:     0 0 80px rgba(var(--signal-rgb),.55);

  /* Shadows */
  --shadow:      rgba(0,0,0,.6);
  --shadow-sm:   0 2px 8px rgba(0,0,0,.4);
  --shadow-md:   0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:   0 16px 48px rgba(0,0,0,.6);

  /* Radius */
  --radius-sm:   10px;
  --radius-md:   18px;
  --radius-lg:   24px;
  --radius-pill: 50px;

  /* Gradient helpers */
  --btn-grad:    linear-gradient(135deg, var(--signal), var(--signal-dim));
  --panel-grad:  linear-gradient(155deg, var(--panel), var(--panel-2));

  /* Aurora blobs */
  --aurora-a:    rgba(var(--signal-rgb), .09);
  --aurora-b:    rgba(var(--accent-rgb), .06);
}

/* ---------- Light theme ---------- */
:root[data-theme="light"]{
  --bg:          #EEF2FA;
  --panel:       #FFFFFF;
  --panel-2:     #E2ECFF;
  --line:        #C8D6F0;
  --signal:      #13A866;
  --signal-rgb:  19,168,102;
  --signal-dim:  #0C7F4E;
  --accent:      #2563EB;
  --accent-rgb:  37,99,235;
  --text:        #0D1626;
  --muted:       #5A6B84;
  --glass:       rgba(255,255,255,.72);
  --glass-border:rgba(0,0,0,.06);
  --shadow:      rgba(16,22,42,.12);
  --aurora-a:    rgba(var(--signal-rgb), .07);
  --aurora-b:    rgba(var(--accent-rgb), .05);
}

/* ---------- Colour palettes ---------- */
:root[data-palette="blue"]{
  --signal:#4CC2FF; --signal-rgb:76,194,255; --signal-dim:#1E7BB0; --accent:#7CC7FF; --aurora-a:rgba(76,194,255,.09);
}
:root[data-theme="light"][data-palette="blue"]{
  --signal:#0E7FC4; --signal-rgb:14,127,196; --signal-dim:#0A5F94; --accent:#1A6FA6; --aurora-a:rgba(14,127,196,.07);
}
:root[data-palette="purple"]{
  --signal:#B98CFF; --signal-rgb:185,140,255; --signal-dim:#7A54B8; --accent:#C9A8FF; --aurora-a:rgba(185,140,255,.09);
}
:root[data-theme="light"][data-palette="purple"]{
  --signal:#7B4FD6; --signal-rgb:123,79,214; --signal-dim:#5C3AA3; --accent:#8A5FE0; --aurora-a:rgba(123,79,214,.07);
}
:root[data-palette="red"]{
  --signal:#FF5C77; --signal-rgb:255,92,119; --signal-dim:#B8384F; --accent:#FF8FA3; --aurora-a:rgba(255,92,119,.09);
}
:root[data-theme="light"][data-palette="red"]{
  --signal:#D6285A; --signal-rgb:214,40,90; --signal-dim:#A31D44; --accent:#E0507A; --aurora-a:rgba(214,40,90,.07);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after{ box-sizing:border-box; }
html, body{ height:100%; margin:0; }

body{
  background: var(--bg);
  color: var(--text);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  transition: background-color .3s ease, color .3s ease;
  position: relative;
  overflow-x: hidden;
}

/* ---------- Aurora animated background ---------- */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 25%, var(--aurora-a) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 85% 75%, var(--aurora-b) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 0%,  var(--aurora-a) 0%, transparent 60%);
  animation: auroraFloat 12s ease-in-out infinite alternate;
  pointer-events:none;
  z-index:0;
}

@keyframes auroraFloat{
  0%  { transform: scale(1)    translate(0%,   0%);   opacity:.85; }
  50% { transform: scale(1.08) translate(-1.5%, 2%); opacity:1; }
  100%{ transform: scale(1.04) translate(2%,  -1.5%); opacity:.9; }
}

/* ---------- Background grid lines ---------- */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    repeating-linear-gradient(0deg,   rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 36px),
    repeating-linear-gradient(90deg,  rgba(255,255,255,.008) 0px, rgba(255,255,255,.008) 1px, transparent 1px, transparent 36px);
  pointer-events:none;
  z-index:0;
}
:root[data-theme="light"] body::after{
  background-image:
    repeating-linear-gradient(0deg,  rgba(0,0,0,.025) 0px, rgba(0,0,0,.025) 1px, transparent 1px, transparent 36px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.018) 0px, rgba(0,0,0,.018) 1px, transparent 1px, transparent 36px);
}

.wrap{
  max-width: 460px;
  margin: 0 auto;
  min-height: 100vh;
  padding:
    calc(28px + env(safe-area-inset-top))
    calc(20px + env(safe-area-inset-right))
    calc(110px + env(safe-area-inset-bottom))
    calc(20px + env(safe-area-inset-left));
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   GLASS CARD — shared base
   ============================================================ */
.glass{
  background: var(--glass);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}

/* ============================================================
   LANGUAGE SCREEN
   ============================================================ */
#langScreen{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:28px;
  text-align:center;
}

/* ============================================================
   AUTH SCREEN (login / register gate)
   ============================================================ */
#authScreen{
  display:none;
  flex:1;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  text-align:center;
}
.auth-card{
  width:100%;
  background:var(--glass);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  padding:20px;
  box-shadow:var(--shadow-md);
  box-sizing:border-box;
}
.auth-tabs{
  display:flex; gap:8px; margin-bottom:18px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-pill);
  padding:4px;
}
.auth-tab-btn{
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:7px;
  padding:10px 12px;
  border:none; border-radius:var(--radius-pill);
  background:transparent; color:var(--muted);
  font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
  cursor:pointer;
  transition:background .18s, color .18s;
}
.auth-tab-btn.active{
  background:var(--btn-grad);
  color:#041A0D;
}
.auth-panel{ text-align:left; }
.auth-hint{
  font-size:13px; color:var(--muted); line-height:1.5;
  margin:0 0 16px; text-align:center;
}
.auth-tg-widget{
  display:flex; justify-content:center; min-height:40px;
}
.auth-mode-switch{
  display:flex; gap:18px; margin-bottom:16px;
  border-bottom:1px solid var(--glass-border);
}
.auth-mode-btn{
  background:none; border:none; cursor:pointer;
  padding:0 0 10px; margin-bottom:-1px;
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
  color:var(--muted);
  border-bottom:2px solid transparent;
  transition:color .15s, border-color .15s;
}
.auth-mode-btn.active{ color:var(--text); border-bottom-color:var(--signal); }
.auth-input{
  width:100%; box-sizing:border-box;
  background:rgba(255,255,255,.04);
  border:1px solid var(--glass-border);
  border-radius:10px;
  color:var(--text);
  font-family:'Inter',sans-serif; font-size:16px;
  padding:12px 14px;
  margin-bottom:10px;
  transition:border-color .15s;
}
.auth-input:focus{
  outline:none;
  border-color:var(--signal-dim);
  box-shadow:0 0 0 3px rgba(var(--signal-rgb),.1);
}
.auth-recaptcha-zone{ display:flex; justify-content:center; margin-top:14px; transform:scale(.92); transform-origin:center; }
.auth-submit-zone{ margin-top:6px; }
.auth-submit-btn{
  width:100%;
  background:linear-gradient(135deg, var(--signal), color-mix(in srgb, var(--signal) 60%, var(--accent)));
  border:none; color:#041A0D;
  border-radius:var(--radius-pill);
  padding:13px 22px;
  font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;
  cursor:pointer;
  box-shadow:0 3px 14px rgba(var(--signal-rgb),.3);
  transition:transform .12s, opacity .15s, box-shadow .15s;
}
@supports not (color: color-mix(in srgb, red, blue)){
  .auth-submit-btn{ background:var(--btn-grad); }
}
.auth-submit-btn:active{ transform:scale(.97); }
.auth-submit-btn:disabled{ opacity:.5; cursor:not-allowed; }
.auth-status{
  display:block; margin-top:10px; min-height:16px;
  font-size:12.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace;
  text-align:center;
}
.auth-status.ok{ color:var(--signal); }
.auth-status.err{ color:#FF6B6B; }
.logout-btn{
  width:38px; height:38px;
  border-radius:12px;
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  color:var(--text);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
  transition:border-color .15s ease, color .15s ease;
}
.logout-btn:hover{ border-color:#FF6B6B; color:#FF6B6B; }
.logout-btn svg{ width:16px; height:16px; }

.lang-screen-top{
  position:absolute;
  top:20px; right:20px;
}

/* Logo mark (large) */
.logo-mark{
  width:72px; height:72px;
  border-radius:22px;
  background: linear-gradient(160deg, #162240, #0D1528);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glow-xs), var(--shadow-md);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  position:relative;
}
.logo-mark::after{
  content:'';
  position:absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 60%);
  border-radius:inherit;
  pointer-events:none;
}
.logo-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
.logo-mark svg{ width:30px; height:30px; }

.brand{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:28px;
  letter-spacing:-.02em;
  margin:0;
}
.brand span{ color:var(--signal); }

.lang-prompt{
  color:var(--muted);
  font-size:14px;
  margin:0;
  line-height:1.5;
}

.lang-options{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:100%;
}

.lang-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  padding:17px 20px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--glass-border);
  background: var(--glass);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  color: var(--text);
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.06);
  transition: border-color .2s ease, transform .12s ease, box-shadow .2s ease;
}
.lang-btn:hover{
  border-color: var(--signal-dim);
  box-shadow: var(--glow-xs), var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.08);
}
.lang-btn:active{ transform: scale(.97); }

.flag{ font-size:22px; }

/* ============================================================
   THEME TOGGLE
   ============================================================ */
.theme-toggle{
  width:38px; height:38px;
  border-radius:12px;
  border:1px solid var(--glass-border);
  background: var(--glass);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  color: var(--text);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition: border-color .15s ease, transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease;
}
.theme-toggle:active{ transform: scale(.88) rotate(-10deg); }
.theme-toggle:hover{ border-color: var(--signal-dim); box-shadow: var(--glow-xs); }
.theme-toggle svg{ width:16px; height:16px; }
.theme-toggle .icon-moon{ display:block; }
.theme-toggle .icon-sun{ display:none; }
:root[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
:root[data-theme="light"] .theme-toggle .icon-sun{ display:block; }

/* Palette dots */
.palette-switch{ display:flex; align-items:center; gap:8px; }
.palette-dot{
  position:relative;
  width:18px; height:18px;
  border-radius:50%;
  border:2px solid var(--line);
  background: var(--dot);
  padding:0; cursor:pointer;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s ease, box-shadow .15s ease;
}
.palette-dot::before{ content:''; position:absolute; inset:-10px; }
.palette-dot:active{ transform:scale(.82); }
.palette-dot.active{
  border-color: var(--text);
  box-shadow: 0 0 0 2px var(--bg);
  transform: scale(1.15);
}

/* ============================================================
   MAIN APP SCREEN
   ============================================================ */
#mainScreen{ display:none; flex:1; flex-direction:column; }

/* ---------- Page-load reveal ---------- */
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(14px); }
  to  { opacity:1; transform:translateY(0); }
}
#mainScreen.is-ready .eyebrow      { animation:fadeUp .5s cubic-bezier(.22,1,.36,1)       both; }
#mainScreen.is-ready .hero-title   { animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .06s  both; }
#mainScreen.is-ready .hero-sub     { animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .12s  both; }
#mainScreen.is-ready .vpn-status-card  { animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .16s  both; }
#mainScreen.is-ready .visitors-panel { animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .20s  both; }
#mainScreen.is-ready .cta-btn      { animation:fadeUp .55s cubic-bezier(.22,1,.36,1) .32s both; }
#mainScreen.is-ready .share-bar    { animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .38s  both; }
@media (prefers-reduced-motion:reduce){
  #mainScreen.is-ready .eyebrow,#mainScreen.is-ready .hero-title,
  #mainScreen.is-ready .hero-sub,#mainScreen.is-ready .vpn-status-card,
  #mainScreen.is-ready .visitors-panel,
  #mainScreen.is-ready .cta-btn,#mainScreen.is-ready .share-bar{ animation:none; }
}

/* ---------- Top navigation row ---------- */
.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  row-gap:10px;
  margin-bottom:28px;
}
.top-row .brand{ font-size:20px; }
.top-row-left{
  display:flex; align-items:center; gap:10px;
}
.top-row-right{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;
}
@media (max-width:360px){
  .top-row-right{ gap:6px; }
  .lang-switch button{ padding:7px 7px; }
  .palette-switch{ gap:6px; }
}

.logo-mark-sm{
  width:36px; height:36px;
  border-radius:10px;
  overflow:hidden;
  flex-shrink:0;
  border:1px solid var(--glass-border);
  box-shadow: var(--glow-xs);
}
.logo-mark-sm img{ width:100%; height:100%; object-fit:cover; display:block; }

.lang-switch{ display:flex; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:11px; }
.lang-switch button{
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  padding:8px 9px;
  border-radius:8px;
  cursor:pointer;
  transition: color .15s, border-color .15s, transform .1s;
}
.lang-switch button:active{ transform:scale(.92); }
.lang-switch button.active{ color:var(--signal); border-color:var(--signal-dim); }

/* ---------- Eyebrow ---------- */
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  display:flex; align-items:center; gap:8px;
  margin-bottom:10px;
}
.dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--signal);
  box-shadow: 0 0 10px var(--signal);
  animation:blink 1.8s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
@media (prefers-reduced-motion:reduce){ .dot{ animation:none; } }

/* ---------- Hero text ---------- */
.hero-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:-.02em;
  line-height:1.26;
  margin:0 0 10px;
}
.hero-sub{
  color:var(--muted);
  font-size:14.5px;
  line-height:1.65;
  max-width:38ch;
  margin:0 0 26px;
}

/* ============================================================
   ROUTE TRACE — encrypted tunnel diagram
   ============================================================ */
/* ============================================================
   VPN STATUS CARD v2 — shield hero + benefit copy
   ============================================================ */
.vpn-status-card{
  display:flex;
  align-items:center;
  gap:18px;
  margin:0 0 22px;
  padding:20px;
  position:relative;
  overflow:hidden;
  background: linear-gradient(150deg, rgba(var(--signal-rgb),.14), var(--glass) 60%);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border:1px solid var(--glass-border);
  border-radius: 26px;
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.06);
}
.vpn-status-card::after{
  content:'';
  position:absolute;
  top:-40%; right:-20%;
  width:180px; height:180px;
  background: radial-gradient(circle, rgba(var(--signal-rgb),.16), transparent 70%);
  pointer-events:none;
}

.vsc-shield-wrap{
  position:relative;
  flex-shrink:0;
  width:60px; height:60px;
  display:flex; align-items:center; justify-content:center;
}
.vsc-glow{
  position:absolute; inset:-10px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(var(--signal-rgb),.35), transparent 70%);
  filter:blur(4px);
  animation: vscGlowPulse 2.6s ease-in-out infinite;
}
@keyframes vscGlowPulse{ 0%,100%{ opacity:.6; transform:scale(.94); } 50%{ opacity:1; transform:scale(1.06); } }
@media (prefers-reduced-motion:reduce){ .vsc-glow{ animation:none; } }

.vsc-shield{
  position:relative;
  width:56px; height:56px;
  border-radius:18px;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(circle at 34% 26%, rgba(255,255,255,.55), transparent 45%), var(--signal);
  color:#052010;
  box-shadow: var(--glow-sm), 0 8px 20px rgba(var(--signal-rgb),.4);
}
:root[data-theme="light"] .vsc-shield{ color:#fff; }
.vsc-shield svg{ width:26px; height:26px; }

.vsc-check-badge{
  position:absolute;
  right:-4px; bottom:-4px;
  width:22px; height:22px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: var(--bg);
  border:2px solid var(--signal);
  color:var(--signal);
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.vsc-check-badge svg{ width:11px; height:11px; }

.vsc-body{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:5px;
  position:relative; z-index:1;
}

.vsc-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:18px;
  color:var(--text);
  letter-spacing:-.01em;
}
.vsc-sub{
  font-size:12.5px;
  color:var(--muted);
}

.vsc-meta-row{
  margin-top:6px;
}
.vsc-meta-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:999px;
  background: rgba(var(--signal-rgb),.10);
  border:1px solid rgba(var(--signal-rgb),.28);
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  font-weight:600;
  color:var(--signal);
  letter-spacing:.04em;
}
.vsc-pulse-dot{
  width:6px; height:6px;
  border-radius:50%;
  background:var(--signal);
  box-shadow:0 0 6px rgba(var(--signal-rgb),.8);
  animation: vscBlink 2s ease infinite;
}
@keyframes vscBlink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
@media (prefers-reduced-motion:reduce){ .vsc-pulse-dot{ animation:none; } }

/* ============================================================
   STATS ROW
   ============================================================ */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}
.stat{
  position:relative;
  background: var(--glass);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  border: 1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:16px 8px 14px;
  text-align:center;
  box-shadow: var(--shadow-sm);
  overflow:hidden;
  transition: transform .2s ease, box-shadow .2s ease;
}
.stat:hover{
  transform:translateY(-2px);
  box-shadow: var(--shadow-md), var(--glow-xs);
}
.stat::before{
  content:'';
  position:absolute; top:0; left:16%; right:16%;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--signal), transparent);
  opacity:.5;
}
.stat .num{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:18px;
  color:var(--signal);
  margin-bottom:3px;
  text-shadow: 0 0 16px rgba(var(--signal-rgb),.4);
}
.stat .label{
  font-size:10px;
  color:var(--muted);
  line-height:1.3;
}

/* ============================================================
   LIVE VISITORS PANEL
   ============================================================ */
.visitors-panel{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background: var(--glass);
  backdrop-filter: var(--blur-sm);
  -webkit-backdrop-filter: var(--blur-sm);
  border: 1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:26px 16px 22px;
  margin-bottom:28px;
  text-align:center;
  box-shadow: var(--shadow-sm);
  overflow:hidden;
  transition: transform .2s ease, box-shadow .2s ease;
}
.visitors-panel:hover{
  transform:translateY(-2px);
  box-shadow: var(--shadow-md), var(--glow-xs);
}
.visitors-panel::before{
  content:'';
  position:absolute; top:0; left:16%; right:16%;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--signal), transparent);
  opacity:.6;
}
.vp-icon-wrap{
  position:relative;
  width:42px; height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--signal);
  margin-bottom:6px;
}
.vp-icon{
  width:26px; height:26px;
  filter: drop-shadow(0 0 8px rgba(var(--signal-rgb),.5));
}
.vp-live-dot{
  position:absolute;
  top:1px; right:1px;
  width:9px; height:9px;
  border-radius:50%;
  background:var(--signal);
  box-shadow:0 0 8px rgba(var(--signal-rgb),.85);
  animation: vscBlink 2s ease infinite;
}
.vp-num{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:38px;
  line-height:1;
  color:var(--signal);
  text-shadow: 0 0 22px rgba(var(--signal-rgb),.45);
}
.vp-label{
  font-size:12px;
  color:var(--muted);
  letter-spacing:.02em;
}

/* ============================================================
   CTA BUTTON — main hero button
   ============================================================ */
.cta-btn{
  position:relative;
  width:100%;
  border:none;
  border-radius: var(--radius-pill);
  padding:22px 28px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:.01em;
  background: linear-gradient(135deg, var(--signal) 0%, color-mix(in srgb, var(--signal) 55%, var(--accent)) 100%);
  color:#041A0D;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:
    0 0 0 1px rgba(var(--signal-rgb),.35),
    0 10px 40px rgba(var(--signal-rgb),.45),
    0 4px 12px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.3);
  transition: transform .12s ease, box-shadow .18s ease;
  overflow:hidden;
  margin-bottom:12px;
}
/* color-mix fallback for older browsers */
@supports not (color: color-mix(in srgb, red, blue)) {
  .cta-btn{ background: var(--btn-grad); }
}
.cta-btn::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 60%);
  border-radius:inherit;
  pointer-events:none;
}
.cta-btn::after{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%);
  background-size:240% 100%;
  background-position:130% 0;
  transition:background-position .6s ease;
  pointer-events:none;
}
.cta-btn:hover::after{ background-position:-30% 0; }
.cta-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 0 1px rgba(var(--signal-rgb),.5),
    0 14px 50px rgba(var(--signal-rgb),.6),
    0 6px 20px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.35);
}
.cta-btn:active{
  transform:scale(.97) translateY(0);
  box-shadow:
    0 0 0 1px rgba(var(--signal-rgb),.3),
    0 6px 24px rgba(var(--signal-rgb),.35),
    0 2px 8px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.25);
}

/* ============================================================
   SHARE BAR
   ============================================================ */
.share-bar{
  display:flex;
  gap:8px;
  margin-bottom:28px;
}
.share-btn{
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 16px;
  border-radius:var(--radius-pill);
  border:1px solid var(--glass-border);
  background: var(--glass);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:13px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition: border-color .18s, transform .12s, box-shadow .18s;
}
.share-btn:hover{ border-color:var(--signal-dim); box-shadow:var(--shadow-sm), var(--glow-xs); }
.share-btn:active{ transform:scale(.96); }
.share-btn svg{ width:16px; height:16px; flex-shrink:0; }

.share-tg-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 18px;
  border-radius:var(--radius-pill);
  border:1px solid rgba(0,136,204,.35);
  background: rgba(0,136,204,.12);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  color:#5BB8E8;
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:13px;
  text-decoration:none;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
  transition: border-color .18s, transform .12s, box-shadow .18s, background .18s;
}
.share-tg-btn:hover{
  background:rgba(0,136,204,.2);
  border-color:rgba(0,136,204,.6);
  box-shadow: var(--shadow-sm), 0 0 20px rgba(0,136,204,.25);
}
.share-tg-btn:active{ transform:scale(.96); }
.share-tg-btn svg{ width:16px; height:16px; flex-shrink:0; }

/* ============================================================
   VPN SCREEN
   ============================================================ */
#vpnScreen{ display:none; flex:1; flex-direction:column; }
#vpnScreen .top-row{ justify-content:flex-start; margin-bottom:20px; }

.back-btn{
  display:flex; align-items:center; gap:7px;
  background: var(--glass);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  border:1px solid var(--glass-border);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:14px;
  padding:10px 18px;
  border-radius:var(--radius-pill);
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition: border-color .15s, transform .1s, box-shadow .15s;
}
.back-btn:hover{ border-color:var(--signal-dim); box-shadow:var(--shadow-sm), var(--glow-xs); }
.back-btn:active{ transform:scale(.97); }

/* ---------- Reveal card ---------- */
.reveal-card{
  background: var(--glass);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  padding:24px 20px;
  margin-top:4px;
  box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.05);
}

.reveal-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:15px;
  margin:0 0 16px;
  display:flex; align-items:center; gap:9px;
}
.reveal-title .pulse{
  width:9px; height:9px; border-radius:50%;
  background:var(--signal);
  box-shadow:0 0 10px var(--signal);
  animation:blink 1.8s ease-in-out infinite;
  flex-shrink:0;
}

/* ---------- QR code ---------- */
.qr-wrap{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  margin-bottom:20px;
}
.qr-box{
  background:#FFFFFF;
  padding:12px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.1);
  line-height:0;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
}
.qr-box img, .qr-box canvas, .qr-box table{
  display:block; width:150px!important; height:150px!important;
}
.qr-hint{
  font-size:12px; color:var(--muted); margin:0; text-align:center;
}

/* ---------- Link row ---------- */
.link-row{
  display:flex; gap:8px; margin-bottom:18px;
}
.link-box{
  flex:1;
  background:rgba(255,255,255,.04);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:13px 12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--accent);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.3);
  transition:background .25s;
}
.link-box.flash{ animation:linkFlash .5s ease; }
@keyframes linkFlash{
  0%{ background:rgba(var(--signal-rgb),.22); }
  100%{ background:rgba(255,255,255,.04); }
}

.copy-btn{
  flex-shrink:0;
  background:linear-gradient(135deg, var(--signal), color-mix(in srgb, var(--signal) 60%, var(--accent)));
  border:none;
  color:#041A0D;
  border-radius:var(--radius-pill);
  padding:0 20px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  box-shadow:0 4px 18px rgba(var(--signal-rgb),.35);
  transition: transform .15s, box-shadow .15s;
}
@supports not (color: color-mix(in srgb, red, blue)){
  .copy-btn{ background:var(--btn-grad); }
}
.copy-btn:active{ transform:scale(.93); }
.copy-btn:hover{ box-shadow:0 6px 26px rgba(var(--signal-rgb),.5); }
.copy-btn.copied{
  background:var(--signal-dim);
  animation:copyPop .35s ease;
}
.copy-btn .check-ico{ display:none; width:14px; height:14px; animation:checkIn .3s ease; }
.copy-btn.copied .check-ico{ display:block; }
@keyframes copyPop{
  0%{ transform:scale(1); } 35%{ transform:scale(1.1); } 100%{ transform:scale(1); }
}
@keyframes checkIn{
  0%{ transform:scale(0) rotate(-20deg); opacity:0; }
  60%{ transform:scale(1.2) rotate(0); opacity:1; }
  100%{ transform:scale(1); }
}

/* ---------- Divider ---------- */
.divider{
  border:none;
  border-top:1px solid var(--glass-border);
  margin:18px 0;
}

/* ---------- Instructions ---------- */
.instr-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600; font-size:14px; margin:0 0 6px;
}
.instr-note{
  font-size:12px; color:var(--muted); line-height:1.55; margin:0 0 14px;
}

/* ---------- Step 1 highlight ---------- */
.step-1{
  font-size:13px;
  color:var(--text);
  background:rgba(var(--signal-rgb),.08);
  border:1px solid rgba(var(--signal-rgb),.22);
  border-radius:12px;
  padding:11px 14px;
  margin-bottom:16px;
  display:flex; gap:8px; align-items:flex-start;
}

/* ---------- Device picker ---------- */
.device-picker{ margin-bottom:20px; }
.device-picker-label{
  font-size:13.5px; font-weight:600; color:var(--text); margin:0 0 8px;
}
.device-picker-hint{
  font-size:12px; color:var(--muted); line-height:1.5; margin:-2px 0 12px;
}
.device-switch{
  position:relative; display:flex; flex-direction:column; gap:10px;
}
.device-btn{
  position:relative; z-index:1;
  display:flex; align-items:center; justify-content:flex-start; gap:16px;
  width:100%;
  padding:16px 18px;
  border-radius:var(--radius-md);
  border:1.5px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  color:var(--muted);
  font-family:'Inter',sans-serif;
  cursor:pointer; text-align:left;
  box-shadow:var(--shadow-sm);
  transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
}
.device-btn .device-ico{ font-size:30px; line-height:1; flex-shrink:0; }
.device-btn .device-label{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
  color:var(--text); display:block;
}
.device-btn .device-sub{ font-size:12px; color:var(--muted); display:block; margin-top:2px; }
.device-btn .device-text{ display:flex; flex-direction:column; }
.device-btn .device-check{
  margin-left:auto; flex-shrink:0;
  width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--line);
  background:transparent;
  transition: border-color .15s, background .15s;
}
.device-btn:active{ transform:scale(.98); }
.device-btn.active{
  background:linear-gradient(135deg, rgba(var(--signal-rgb),.16), rgba(var(--signal-rgb),.06));
  border-color:var(--signal);
  box-shadow:var(--shadow-sm), 0 4px 20px rgba(var(--signal-rgb),.18);
}
.device-btn.active .device-label{ color:var(--signal); }
.device-btn.active .device-check{
  border-color:var(--signal);
  background:var(--signal);
  box-shadow:inset 0 0 0 3.5px var(--panel-2);
}

/* ---------- App blocks ---------- */
.app-block{
  margin-bottom:12px;
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:16px;
  background:var(--glass);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  box-shadow:var(--shadow-sm);
}
.app-block:last-child{ margin-bottom:0; }
.app-name{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px; font-weight:600;
  color:var(--accent); margin:0 0 10px;
}
.app-steps{
  list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:7px;
}
.app-steps li{
  font-size:13px; color:var(--muted); line-height:1.5;
  display:flex; gap:8px;
}
.app-steps li::before{ content:'•'; color:var(--signal-dim); flex-shrink:0; }

.open-app-btn{
  display:flex; align-items:stretch;
  margin-top:14px;
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(var(--signal-rgb),.25);
  background:rgba(10,10,18,.75);
  text-decoration:none; cursor:pointer;
  box-shadow:0 6px 28px rgba(0,0,0,.55), 0 0 0 0 rgba(var(--signal-rgb),0);
  transition: transform .13s cubic-bezier(.22,1,.36,1), box-shadow .18s, border-color .18s;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.open-app-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(var(--signal-rgb),.55);
  box-shadow:0 10px 38px rgba(0,0,0,.6), 0 0 18px rgba(var(--signal-rgb),.22);
}
.open-app-btn:active{ transform:scale(.97) translateY(0); }

/* Left accent stripe */
.open-app-btn .store-ico{
  display:flex; align-items:center; justify-content:center;
  width:62px; flex-shrink:0;
  background: linear-gradient(160deg, var(--signal), var(--accent));
  font-size:26px; line-height:1;
}

/* Right text area */
.open-app-btn .store-text{
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  padding:14px 18px; gap:2px; flex:1;
}
.open-app-btn .store-text small{
  font-family:'Inter',sans-serif; font-size:10px; font-weight:700;
  color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:.08em;
}
.open-app-btn .store-text strong{
  font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700;
  color:#fff; letter-spacing:-.01em;
}

/* ============================================================
   FAQ
   ============================================================ */
.faq-section{ margin-top:30px; }
.faq-heading{
  font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; margin:0 0 12px;
}
.faq-item{
  background:var(--glass);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  margin-bottom:8px; overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition: border-color .2s;
}
.faq-item.open{ border-color:rgba(var(--signal-rgb),.2); }
.faq-q{
  width:100%; text-align:left;
  background:transparent; border:none;
  color:var(--text);
  font-family:'Inter',sans-serif; font-weight:500; font-size:13.5px;
  padding:15px 16px; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  transition:color .15s;
}
.faq-q:hover{ color:var(--signal); }
.faq-q .chev{ color:var(--muted); transition:transform .22s ease, color .15s; flex-shrink:0; }
.faq-item.open .faq-q .chev{ transform:rotate(180deg); color:var(--signal); }
.faq-a{
  max-height:0; overflow:hidden;
  transition:max-height .32s ease;
}
.faq-item.open .faq-a{ max-height:320px; }
.faq-a p{
  margin:0; padding:0 16px 14px;
  font-size:13px; color:var(--muted); line-height:1.6;
}

/* ============================================================
   REVIEWS
   ============================================================ */
.reviews-section{ margin-top:30px; }
.reviews-heading{
  font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; margin:0 0 12px;
}
.reviews-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.review-card{
  background:var(--glass);
  backdrop-filter:var(--blur-sm);
  -webkit-backdrop-filter:var(--blur-sm);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
}
.review-card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.review-card-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; }
.review-card-stars{ color:var(--signal); font-size:12px; letter-spacing:1px; white-space:nowrap; }
.review-card-text{ font-size:13px; color:var(--muted); line-height:1.55; margin:0; word-break:break-word; }
.review-card-date{ font-size:10.5px; color:var(--muted); opacity:.7; margin-top:6px; }
.reviews-empty{ font-size:13px; color:var(--muted); text-align:center; padding:10px 0; }

.review-form{ padding:18px 16px; margin-top:4px; }
.review-stars{ display:flex; gap:6px; justify-content:center; margin-bottom:12px; }
.review-star{
  background:none; border:none; cursor:pointer; padding:2px;
  font-size:24px; line-height:1; color:var(--line);
  transition:color .15s, transform .1s;
}
.review-star.active{ color:var(--signal); }
.review-star:active{ transform:scale(.88); }
.review-textarea{

  // ---- Fetch subscription link ----
  async function loadSubscription(retries = 3){
    for(let attempt = 1; attempt <= retries; attempt++){
      try{
        const res = await fetch(`${SUBSCRIPTION_GIST_URL}?t=${Date.now()}`);
        if(!res.ok) throw new Error('bad response');
        const text = (await res.text()).trim();
        if(text){
          // subUrl stays as SUBSCRIPTION_GIST_URL — that IS the subscription URL.
          // The Gist file contains VPN configs (not a URL), so we must pass the
          // Gist URL itself to happ://add/ and incy://add/, not the file content.
          subUrlReady = true;
          break;
        }
      }catch(e){
        if(attempt < retries) await new Promise(r => setTimeout(r, 800 * attempt));
      }
    }
    if(el.linkBox) el.linkBox.textContent = subUrl;
    renderQr();
  }

  let _lastReviews = [];
  function renderReviewsList(list){
    _lastReviews = list || [];
    if(!el.reviewsList) return;
    el.reviewsList.innerHTML = '';
    if(!_lastReviews.length){
      const empty = document.createElement('p');
      empty.className = 'reviews-empty';
      empty.textContent = dict[lang].reviewsEmpty;
      el.reviewsList.appendChild(empty);
      return;
    }
    _lastReviews.forEach(r=>{
      const card = document.createElement('div');
      card.className = 'review-card';

      const top = document.createElement('div');
      top.className = 'review-card-top';

      const name = document.createElement('span');
      name.className = 'review-card-name';
      name.textContent = r.name || '—';

      const stars = document.createElement('span');
      stars.className = 'review-card-stars';
      const rating = Math.max(1, Math.min(5, parseInt(r.rating,10) || 5));
      stars.textContent = '★'.repeat(rating) + '☆'.repeat(5-rating);

      top.appendChild(name);
      top.appendChild(stars);

      const text = document.createElement('p');
      text.className = 'review-card-text';
      text.textContent = r.text || '';

      card.appendChild(top);
      card.appendChild(text);

      if(r.created_at){
        const date = document.createElement('div');
        date.className = 'review-card-date';
        try{ date.textContent = new Date(r.created_at).toLocaleDateString(lang==='hy'?'hy-AM':lang==='ru'?'ru-RU':'en-US'); }
        catch(e){ date.textContent = ''; }
        card.appendChild(date);
      }

      el.reviewsList.appendChild(card);
    });
  }

    });
  });

  // ---- Telegram Login Widget ----
  let _tgWidgetRendered = false;
  function renderTelegramWidget(){
    if(!el.telegramLoginContainer || _tgWidgetRendered) return;
    _tgWidgetRendered = true;
    const script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-widget.js?22';
    script.setAttribute('data-telegram-login', 'VedaVPNAuth_bot');
    script.setAttribute('data-size', 'large');
    script.setAttribute('data-radius', '50');
    script.setAttribute('data-onauth', 'onTelegramAuth(user)');
    script.setAttribute('data-request-access', 'write');
    script.async = true;
    el.telegramLoginContainer.appendChild(script);
  }

  window.onTelegramAuth = function(tgUser){
    try{ localStorage.setItem('vedavpn_tg_user', JSON.stringify(tgUser)); }catch(e){}
    haptic(15);
    confettiBurst();
    showMain();
  };

  // ---- Email login / register ----
  function setAuthStatus(text, cls){
    if(!el.authStatus) return;
    el.authStatus.textContent = text;
    el.authStatus.className = 'auth-status' + (cls ? ' '+cls : '');
  }

  function mapAuthError(code, d){
    switch(code){
      case 'auth/invalid-email': return d.authErrInvalidEmail;
      case 'auth/weak-password': return d.authErrWeakPassword;
      case 'auth/email-already-in-use': return d.authErrEmailInUse;
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
      case 'auth/invalid-login-credentials': return d.authErrWrongPassword;
      case 'auth/user-not-found': return d.authErrUserNotFound;
      default: return d.authErrGeneric;
    }
  }

  // ---- reCAPTCHA v2 ----
  let recaptchaToken = null;
  window.onRecaptchaSuccess = function(token){ recaptchaToken = token; };
  window.onRecaptchaExpired = function(){ recaptchaToken = null; };

  async function verifyCaptchaOnServer(token){
    try{
      const res = await fetch(CAPTCHA_VERIFY_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ token })
      });
      if(!res.ok) return false;
      const data = await res.json();
      return !!(data && data.success);
    }catch(e){
      console.error('VedaVPN captcha verify error:', e);
      return false;
    }
  }

  el.authSubmitBtn && el.authSubmitBtn.addEventListener('click', async ()=>{
    const d = dict[lang];
    const email = (el.authEmailInput.value||'').trim();
    const password = el.authPasswordInput.value||'';
    if(!email || !password){ setAuthStatus(d.authErrEmpty, 'err'); return; }
    if(typeof firebase === 'undefined'){ setAuthStatus(d.authErrGeneric, 'err'); return; }
    if(!recaptchaToken){ setAuthStatus(d.authErrCaptcha, 'err'); return; }
    el.authSubmitBtn.disabled = true;
    setAuthStatus(d.authSending, '');
    try{
      const captchaOk = await verifyCaptchaOnServer(recaptchaToken);
      if(!captchaOk){
        setAuthStatus(d.authErrCaptcha, 'err');
        if(typeof grecaptcha !== 'undefined' && authRecaptchaWidgetId !== null) grecaptcha.reset(authRecaptchaWidgetId);
        recaptchaToken = null;
        return;
      }
      if(authMode==='login'){
        await firebase.auth().signInWithEmailAndPassword(email, password);
      }else{
        await firebase.auth().createUserWithEmailAndPassword(email, password);
      }
      haptic(15);
      confettiBurst();
      showMain();
    }catch(e){
      console.error('VedaVPN auth error:', e && e.code, e && e.message);
      setAuthStatus(mapAuthError(e && e.code, d), 'err');
    }finally{
      el.authSubmitBtn.disabled = false;
      if(typeof grecaptcha !== 'undefined' && authRecaptchaWidgetId !== null) grecaptcha.reset(authRecaptchaWidgetId);
      recaptchaToken = null;
    }
  });

  el.authPasswordInput && el.authPasswordInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter') el.authSubmitBtn.click();
  });

  // ---- Logout ----
  el.logoutBtn && el.logoutBtn.addEventListener('click', ()=>{
    try{ if(typeof firebase !== 'undefined') firebase.auth().signOut(); }catch(e){}
    localStorage.removeItem('vedavpn_tg_user');
    showAuthScreen();
  });

  function showMain(){
    el.authScreen.style.display = 'none';
    el.langScreen.style.display = 'none';
    el.vpnScreen.style.display  = 'none';
    el.mainScreen.style.display = 'flex';
    renderMain();
    requestAnimationFrame(()=> el.mainScreen.classList.add('is-ready'));
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  }
  function showAuthScreen(){
    el.langScreen.style.display = 'none';
    el.mainScreen.style.display = 'none';
    el.vpnScreen.style.display  = 'none';
    el.authScreen.style.display = 'flex';
    renderAuthStrings();
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  }
  function isAuthenticated(){
    return !!(window.firebase && firebase.auth().currentUser) || !!localStorage.getItem('vedavpn_tg_user');
  }
  function showAuthOrMain(){
    if(isAuthenticated()){ showMain(); } else { showAuthScreen(); }
  }
  function showVpnScreen(){
    el.mainScreen.style.display = 'none';
    el.vpnScreen.style.display  = 'flex';
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  }

  // ---- Language buttons ----
  document.querySelectorAll('#langScreen .lang-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      lang = b.dataset.lang;
      localStorage.setItem('vedavpn_lang', lang);
      showAuthOrMain();
    });
  });
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.addEventListener('click',()=>{
      lang = b.dataset.lang;
      localStorage.setItem('vedavpn_lang', lang);
      renderMain();
    });
  });

  el.ctaBtn.addEventListener('click', ()=>{ haptic(10); showVpnScreen(); });
  el.backBtn.addEventListener('click', showMain);

  // Keep the uptime badge (days + hours) live without needing a page reload.
  setInterval(()=>{
    if(el.mainScreen.style.display !== 'none'){
      const rt = runtimeSinceLaunch();
      el.uptimeBadgeText.textContent = dict[lang].runtimeLabel(rt.days, rt.hours);
    }
  }, 60 * 1000);

  // ---- Share button ----
  el.shareBtn && el.shareBtn.addEventListener('click', async ()=>{
    const shareData = {
      title: 'VedaVPN',
      text: lang === 'ru' ? 'Бесплатный VPN — быстро и без регистрации'
          : lang === 'hy' ? 'Անվճար VPN — արագ և առանց գրանցման'
          : 'Free VPN — fast and no sign-up needed',
      url: 'https://vedavpn.lol'
    };
    if(navigator.share && navigator.canShare && navigator.canShare(shareData)){
      try{ await navigator.share(shareData); }catch(e){}
    } else {
      // Fallback: copy site URL
      try{
        await navigator.clipboard.writeText('https://vedavpn.lol');
        const orig = el.shareBtnText.textContent;
        el.shareBtnText.textContent = '✓ Copied!';
        setTimeout(()=>{ el.shareBtnText.textContent = orig; }, 2000);
      }catch(e){}
    }
  });

  // ---- Copy link ----
  function copyToClipboardSilently(text){
    try{ navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{}); }catch(e){}
  }
  function openAppOrGoToStore(deepLink, storeUrl){
    let didHide = false;
    function onVisibilityChange(){ if(document.hidden) didHide = true; }
    document.addEventListener('visibilitychange', onVisibilityChange);
    window.location.href = deepLink;
    setTimeout(()=>{
      document.removeEventListener('visibilitychange', onVisibilityChange);
      if(!didHide && storeUrl) window.location.href = storeUrl;
    }, 1500);
  }
  function flashBtnError(textEl, smallEl){
    const origText = textEl.textContent;
    const origSmall = smallEl ? smallEl.textContent : null;
    textEl.textContent = dict[lang].linkNotReady;
    if(smallEl) smallEl.textContent = '⚠️';
    setTimeout(()=>{
      textEl.textContent = origText;
      if(smallEl) smallEl.textContent = origSmall;
    }, 2200);
  }
  async function handleOpenAppClick(e, getDeepLink, storeUrlsByOs, textEl, smallEl){
    e.preventDefault();
    if(!subUrlReady){
      // One immediate retry in case the first load failed transiently
      await loadSubscription(1);
      if(!subUrlReady){
        flashBtnError(textEl, smallEl);
        return;
      }
    }
    copyToClipboardSilently(subUrl);
    const storeUrl = storeUrlsByOs[selectedDevice];
    if(detectOS() === selectedDevice){ openAppOrGoToStore(getDeepLink(), storeUrl); }
    else if(storeUrl){ window.location.href = storeUrl; }
  }
  el.openHappBtn.addEventListener('click',(e)=>{ handleOpenAppClick(e, getHappDeepLink, storeLinks.happ, el.openHappBtnText, el.openHappBtnSmall); });
  el.openIncyBtn.addEventListener('click',(e)=>{ handleOpenAppClick(e, getIncyDeepLink, storeLinks.incy, el.openIncyBtnText, el.openIncyBtnSmall); });

  el.deviceBtnAndroid.addEventListener('click',()=>{
    selectedDevice='android'; localStorage.setItem('vedavpn_device', selectedDevice);
    renderDevicePicker(); renderStoreButtons();
  });
  el.deviceBtnIos.addEventListener('click',()=>{
    selectedDevice='ios'; localStorage.setItem('vedavpn_device', selectedDevice);
    renderDevicePicker(); renderStoreButtons();
  });

  el.copyBtn.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(subUrl); }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = subUrl; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    haptic(10);
    el.copyBtnText.textContent = dict[lang].copied;
    el.copyBtn.classList.add('copied');
    el.linkBox.classList.remove('flash');
    void el.linkBox.offsetWidth;
    el.linkBox.classList.add('flash');
    setTimeout(()=>{
      el.copyBtnText.textContent = dict[lang].copy;
      el.copyBtn.classList.remove('copied');
    }, 2000);
  });

  if(lang){ showAuthOrMain(); }

  // ---- Light/Dark theme ----
  (function initTheme(){
    const THEME_KEY = 'vedavpn_theme';
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
      const metaColor = document.getElementById('themeColorMeta');
      if(metaColor) metaColor.content = theme === 'light' ? '#EEF2FA' : '#0A0F1A';
    }
    function currentTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      if(saved==='light'||saved==='dark') return saved;
      return mq.matches ? 'light' : 'dark';
    }
    applyTheme(currentTheme());
    mq.addEventListener('change',(e)=>{
      if(!localStorage.getItem(THEME_KEY)) applyTheme(e.matches?'light':'dark');
    });
    function toggleTheme(){
      const next = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    }
    document.getElementById('themeToggleAuth').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleLang').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleMain').addEventListener('click', toggleTheme);
  })();

  // ---- Colour palette ----
  (function initPalette(){
    const PALETTE_KEY = 'vedavpn_palette';
    const dots = document.querySelectorAll('.palette-dot');
    function applyPalette(palette){
      document.documentElement.setAttribute('data-palette', palette);
      dots.forEach(dot=> dot.classList.toggle('active', dot.dataset.palette===palette));
    }
    applyPalette(localStorage.getItem(PALETTE_KEY)||'green');
    dots.forEach(dot=>{
      dot.addEventListener('click',()=>{
        const palette = dot.dataset.palette;
        applyPalette(palette);
        localStorage.setItem(PALETTE_KEY, palette);
      });
    });
  })();

  // ---- Live visitor counter (unique per device, CountAPI) ----
  (async function trackRealVisit(){
    const statEl = document.getElementById('stat1Num');
    const VISITED_KEY  = 'vedavpn_visitor_id';
    const COUNTER_BASE = 'https://countapi.mileshilliard.com/api/v1';
    const COUNTER_KEY  = 'vedavpn_lol_unique_visitors_2026';

    function animateNum(el, target){
      const start = 0;
      const duration = 1200;
      const startTime = performance.now();
      function step(now){
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(eased * target).toLocaleString('en-US');
        if(progress < 1) requestAnimationFrame(step);
        else el.textContent = target.toLocaleString('en-US');
      }
      requestAnimationFrame(step);
    }

    function renderValue(value){
      if(typeof value === 'number' && !isNaN(value)){
        animateNum(statEl, value);
      } else {
        statEl.textContent = '—';
      }
    }

    async function fetchWithTimeout(url, timeoutMs=8000){
      const controller = new AbortController();
      const timer = setTimeout(()=> controller.abort(), timeoutMs);
      try{ return await fetch(url,{signal:controller.signal}); }
      finally{ clearTimeout(timer); }
    }

    try{
      let visitorId = localStorage.getItem(VISITED_KEY);
      const isNewVisitor = !visitorId;
      if(isNewVisitor){
        visitorId = (crypto&&crypto.randomUUID) ? crypto.randomUUID()
          : 'v-'+Date.now()+'-'+Math.random().toString(36).slice(2);
        localStorage.setItem(VISITED_KEY, visitorId);
      }
      const res = isNewVisitor
        ? await fetchWithTimeout(`${COUNTER_BASE}/hit/${COUNTER_KEY}`)
        : await fetchWithTimeout(`${COUNTER_BASE}/get/${COUNTER_KEY}`);
      if(!res.ok) throw new Error('bad');
      const data = await res.json();
      const value = (data&&data.value!=null) ? parseInt(data.value,10) : null;
      renderValue(value);
    }catch(e){ renderValue(null); }
  })();

  // ---- PWA install prompt ----
  // ---- Haptic feedback helper (Android Chrome; no-op elsewhere) ----
  function haptic(ms){
    try{ if(navigator.vibrate) navigator.vibrate(ms||10); }catch(e){}
  }

  // ---- Scroll to top button ----
  (function initScrollTop(){
    if(!el.scrollTopBtn) return;
    window.addEventListener('scroll', ()=>{
      el.scrollTopBtn.classList.toggle('show', window.scrollY > 500);
    }, {passive:true});
    el.scrollTopBtn.addEventListener('click', ()=>{
      haptic(8);
      window.scrollTo({top:0, behavior:'smooth'});
    });
  })();

  // ---- Confetti burst (celebration effect) ----
  function confettiBurst(){
    if(!el.confettiLayer) return;
    const colors = ['#39FF9E','#6EA8FE','#B98CFF','#FF5C77','#FFD166'];
    const originX = window.innerWidth / 2;
    const pieceCount = 26;
    for(let i=0;i<pieceCount;i++){
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      const angle = (Math.random()*Math.PI) + Math.PI; // upward-ish spread
      const dist  = 90 + Math.random()*160;
      const dx = Math.cos(angle)*dist;
      const dy = Math.abs(Math.sin(angle)*dist) + 140 + Math.random()*120; // fall down
      piece.style.setProperty('--confetti-end', `translate(${dx}px, ${dy}px)`);
      piece.style.setProperty('--confetti-spin', `${(Math.random()*720-360)}deg`);
      piece.style.left = (originX + (Math.random()*40-20)) + 'px';
      piece.style.background = colors[i % colors.length];
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.animationDuration = (900 + Math.random()*700) + 'ms';
      el.confettiLayer.appendChild(piece);
      piece.addEventListener('animationend', ()=> piece.remove());
    }
  }

  // ---- PWA install prompt ----
  (function initPWA(){
    let deferredPrompt = null;
    const DISMISSED_KEY = 'vedavpn_pwa_dismissed';

    window.addEventListener('beforeinstallprompt', e=>{
      e.preventDefault();
      deferredPrompt = e;
      // Only show banner after language is chosen (user is on main screen)
      // and hasn't dismissed it before
      if(!localStorage.getItem(DISMISSED_KEY)){
        setTimeout(()=>{
          const onMain = el.mainScreen && el.mainScreen.style.display !== 'none';
          if(onMain) el.pwaBanner && el.pwaBanner.classList.add('show');
        }, 4000);
      }
    });

    el.pwaInstallBtn && el.pwaInstallBtn.addEventListener('click', async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      el.pwaBanner.classList.remove('show');
      if(outcome === 'accepted') localStorage.setItem(DISMISSED_KEY, '1');
    });

    el.pwaDismissBtn && el.pwaDismissBtn.addEventListener('click', ()=>{
      el.pwaBanner.classList.remove('show');
      localStorage.setItem(DISMISSED_KEY, '1');
    });

    // Register service worker
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      });
    }
  })();

})();
</script>

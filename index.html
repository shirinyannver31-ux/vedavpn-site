<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VedaVPN</title>
<meta property="og:title" content="VedaVPN — Fast &amp; Secure VPN">
<meta property="og:description" content="Get your free VPN link in seconds. No logs, high speed, servers worldwide.">
<meta property="og:image" content="https://vedavpn.lol/og-image.png">
<meta property="og:url" content="https://vedavpn.lol/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VedaVPN — Fast &amp; Secure VPN">
<meta name="twitter:description" content="Get your free VPN link in seconds. No logs, high speed, servers worldwide.">
<meta name="twitter:image" content="https://vedavpn.lol/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0A0F1A;
    --panel:     #131D33;
    --panel-2:   #1D2C4F;
    --line:      #2C3A5C;
    --signal:    #39FF9E;
    --signal-rgb:57,255,158;
    --signal-dim:#1D8F60;
    --accent:    #6EA8FE;
    --text:      #ECEFF4;
    --muted:     #838DA3;
    --bg-glow:   rgba(var(--signal-rgb),0.07);
    --bg-lines:  rgba(255,255,255,0.015);
    --shadow:    rgba(0,0,0,0.55);
  }
  :root[data-theme="light"]{
    --bg:        #F3F6FB;
    --panel:     #FFFFFF;
    --panel-2:   #E6F0FE;
    --line:      #D7E1F3;
    --signal:    #17A968;
    --signal-rgb:23,169,104;
    --signal-dim:#0E8A54;
    --accent:    #2B6CE0;
    --text:      #101623;
    --muted:     #6A7488;
    --bg-glow:   rgba(23,169,104,0.08);
    --bg-lines:  rgba(16,22,35,0.03);
    --shadow:    rgba(16,22,35,0.10);
  }

  /* ---------- Color themes ("Тема") — swap the accent palette while
     keeping the same dark/light base. Green is the default (no override
     needed). Selected via data-palette on <html>, persisted in localStorage. ---------- */
  :root[data-palette="blue"]{
    --signal:#4CC2FF; --signal-rgb:76,194,255; --signal-dim:#1E6FA8; --accent:#7CC7FF;
    --bg-glow: rgba(76,194,255,0.08);
  }
  :root[data-theme="light"][data-palette="blue"]{
    --signal:#0E7FC4; --signal-rgb:14,127,196; --signal-dim:#0B5F94; --accent:#1C6FA6;
    --bg-glow: rgba(14,127,196,0.08);
  }
  :root[data-palette="purple"]{
    --signal:#B98CFF; --signal-rgb:185,140,255; --signal-dim:#7A54B8; --accent:#C9A8FF;
    --bg-glow: rgba(185,140,255,0.08);
  }
  :root[data-theme="light"][data-palette="purple"]{
    --signal:#7B4FD6; --signal-rgb:123,79,214; --signal-dim:#5C3AA3; --accent:#8A5FE0;
    --bg-glow: rgba(123,79,214,0.08);
  }
  :root[data-palette="red"]{
    --signal:#FF5C77; --signal-rgb:255,92,119; --signal-dim:#B8384F; --accent:#FF8FA3;
    --bg-glow: rgba(255,92,119,0.08);
  }
  :root[data-theme="light"][data-palette="red"]{
    --signal:#D6285A; --signal-rgb:214,40,90; --signal-dim:#A31D44; --accent:#E0507A;
    --bg-glow: rgba(214,40,90,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  :root{
    --panel-grad: linear-gradient(165deg, var(--panel), var(--panel-2));
    --card-shadow: 0 8px 22px var(--shadow), 0 1px 0 rgba(255,255,255,0.04) inset;
    --btn-grad: linear-gradient(135deg, var(--signal), var(--signal-dim));
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    transition:background-color .25s ease, color .25s ease;
    background-image:
      radial-gradient(circle at 50% 0%, var(--bg-glow), transparent 55%),
      repeating-linear-gradient(0deg, var(--bg-lines) 0px, var(--bg-lines) 1px, transparent 1px, transparent 32px);
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Language picker screen ---------- */
  #langScreen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    text-align:center;
  }
  .logo-mark{
    width:64px; height:64px;
    border-radius:18px;
    background:linear-gradient(160deg, #16233d, #0d1526);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .logo-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .logo-mark svg{ width:28px; height:28px; }

  /* ---------- Theme toggle ---------- */
  .theme-toggle{
    width:36px; height:36px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:border-color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .theme-toggle:active{ transform:scale(0.88) rotate(-8deg); }
  .theme-toggle:hover{ border-color:var(--signal-dim); }
  .theme-toggle svg{ width:16px; height:16px; }
  .theme-toggle .icon-moon{ display:block; }
  .theme-toggle .icon-sun{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  .palette-switch{ display:flex; align-items:center; gap:8px; }
  .palette-dot{
    position:relative;
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--dot);
    padding:0;
    cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s ease, box-shadow .15s ease;
  }
  .palette-dot::before{
    content:'';
    position:absolute;
    inset:-10px;
  }
  .palette-dot:active{ transform:scale(0.82); }
  .palette-dot.active{
    border-color:var(--text);
    box-shadow:0 0 0 2px var(--bg);
    transform:scale(1.12);
  }
  .lang-screen-top{
    position:absolute;
    top:20px; right:20px;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .brand span{ color:var(--signal); }
  .lang-prompt{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  .lang-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
  }
  .lang-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 18px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--panel-grad);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:15px;
    cursor:pointer;
    box-shadow:var(--card-shadow);
    transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .lang-btn:active{ transform:scale(0.98); }
  .lang-btn:hover{ border-color:var(--signal-dim); box-shadow:0 4px 20px rgba(var(--signal-rgb),0.18); }
  .flag{ font-size:20px; }

  /* ---------- Main app screen ---------- */
  #mainScreen{ display:none; flex:1; flex-direction:column; }

  /* ---------- Page-load reveal (subtle stagger, respects reduced motion) ---------- */
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  #mainScreen.is-ready .eyebrow{ animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
  #mainScreen.is-ready .hero-title{ animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .05s both; }
  #mainScreen.is-ready .hero-sub{ animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .1s both; }
  #mainScreen.is-ready .route-trace{ animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .14s both; }
  #mainScreen.is-ready .stats{ animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .16s both; }
  #mainScreen.is-ready .features{ animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .22s both; }
  #mainScreen.is-ready .cta-btn{ animation:fadeUp .55s cubic-bezier(.22,1,.36,1) .28s both; }
  @media (prefers-reduced-motion: reduce){
    #mainScreen.is-ready .eyebrow, #mainScreen.is-ready .hero-title, #mainScreen.is-ready .hero-sub,
    #mainScreen.is-ready .route-trace, #mainScreen.is-ready .stats, #mainScreen.is-ready .features, #mainScreen.is-ready .cta-btn{
      animation:none;
    }
  }
  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .top-row .brand{ font-size:20px; }
  .top-row-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-mark-sm{
    width:34px; height:34px;
    border-radius:9px;
    overflow:hidden;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .logo-mark-sm img{ width:100%; height:100%; object-fit:cover; display:block; }
  .lang-switch{
    display:flex; gap:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
  }
  .lang-switch button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 9px;
    border-radius:6px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .lang-switch button:active{ transform:scale(0.92); }
  .lang-switch button.active{ color:var(--signal); border-color:var(--signal-dim); }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 8px var(--signal);
    animation:blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .hero-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:25px;
    letter-spacing:-0.015em;
    line-height:1.28;
    margin:0 0 10px;
  }
  .hero-sub{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.6;
    max-width:36ch;
    margin:0 0 26px;
  }

  /* ---------- Signature element: the encrypted route ----------
     A literal, minimal diagram of what a VPN actually does — traffic
     leaves your device, passes through an encrypted hop, exits on our
     server. Doubles as the page's visual anchor in place of a generic
     hero graphic, and reuses the same accent tokens as the theme/palette
     switcher so it re-colors automatically with the rest of the page. */
  .route-trace{
    display:flex;
    align-items:center;
    margin:0 0 26px;
    padding:16px 14px;
    background:var(--panel-grad);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--card-shadow);
  }
  .route-node{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
  }
  .route-node svg{ width:18px; height:18px; }
  .route-node.lock{
    position:relative;
    color:#062012;
    background:var(--signal);
    border-color:var(--signal);
  }
  :root[data-theme="light"] .route-node.lock{ color:#fff; }
  .route-node.lock::after{
    content:'';
    position:absolute; inset:-4px;
    border-radius:14px;
    border:1px solid rgba(var(--signal-rgb),0.45);
    animation:lockPulse 2.2s ease-out infinite;
  }
  @keyframes lockPulse{
    0%{ transform:scale(0.85); opacity:.9; }
    100%{ transform:scale(1.4); opacity:0; }
  }
  .route-track{
    flex:1;
    height:2px;
    margin:0 8px;
    position:relative;
    background-image:linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    background-size:12px 2px;
    background-repeat:repeat-x;
  }
  .route-track::before{
    content:'';
    position:absolute;
    top:50%; left:0;
    width:6px; height:6px;
    margin-top:-3px;
    border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 6px rgba(var(--signal-rgb),0.8);
    animation:packetMove 2.6s linear infinite;
    opacity:0;
  }
  .route-track.rt-2::before{ animation-delay:1.3s; }
  @keyframes packetMove{
    0%{ left:0; opacity:0; }
    8%{ opacity:1; }
    88%{ opacity:1; }
    100%{ left:calc(100% - 6px); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .route-node.lock::after, .route-track::before{ animation:none; display:none; }
  }

  /* ---------- Stats row ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .stat{
    position:relative;
    background:var(--panel-grad);
    border:1px solid var(--line);
    border-radius:18px;
    padding:15px 8px 14px;
    text-align:center;
    box-shadow:var(--card-shadow);
    overflow:hidden;
  }
  .stat::before{
    content:'';
    position:absolute; top:0; left:14%; right:14%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--signal), transparent);
    opacity:.55;
  }
  .stat .num{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--signal);
    margin-bottom:2px;
  }
  .stat .label{
    font-size:10px;
    color:var(--muted);
    line-height:1.3;
  }

  .features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:28px;
  }
  .feature{
    background:var(--panel-grad);
    border:1px solid var(--line);
    border-radius:18px;
    padding:13px 8px;
    text-align:center;
    box-shadow:var(--card-shadow);
  }
  .feature .ico{ font-size:18px; margin-bottom:6px; }
  .feature .label{
    font-size:10.5px;
    color:var(--muted);
    line-height:1.3;
  }

  .cta-btn{
    position:relative;
    width:100%;
    border:none;
    border-radius:22px;
    padding:20px 22px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:.01em;
    background:var(--btn-grad);
    color:#062012;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 8px 28px rgba(var(--signal-rgb),0.34), 0 1px 0 rgba(255,255,255,0.28) inset;
    transition:transform .12s ease, box-shadow .15s ease;
    overflow:hidden;
  }
  .cta-btn::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.22) 50%, transparent 60%);
    background-size:220% 100%;
    background-position:120% 0;
    transition:background-position .5s ease;
    pointer-events:none;
  }
  .cta-btn:hover::after{ background-position:-20% 0; }
  .cta-btn:active{ transform:scale(0.98); box-shadow:0 4px 16px rgba(var(--signal-rgb),0.3), 0 1px 0 rgba(255,255,255,0.25) inset; }
  .cta-btn:hover{ box-shadow:0 10px 34px rgba(var(--signal-rgb),0.42), 0 1px 0 rgba(255,255,255,0.25) inset; }

  /* ---------- VPN screen (separate screen shown after tapping Get VPN) ---------- */
  #vpnScreen{ display:none; flex:1; flex-direction:column; }
  #vpnScreen .top-row{ justify-content:flex-start; margin-bottom:18px; }
  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:14px;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .back-btn:hover{ border-color:var(--signal-dim); }
  .back-btn:active{ transform:scale(0.97); }
  .reveal-card{
    background:var(--panel-grad);
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px 20px;
    margin-top:4px;
    box-shadow:var(--card-shadow);
  }
  .reveal-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .reveal-title .pulse{
    width:8px; height:8px; border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 8px var(--signal);
  }
  .qr-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
  }
  .qr-box{
    background:#FFFFFF;
    padding:12px;
    border-radius:16px;
    border:1px solid var(--line);
    line-height:0;
    box-shadow:var(--card-shadow);
  }
  .qr-box img, .qr-box canvas, .qr-box table{
    display:block;
    width:150px !important;
    height:150px !important;
  }
  .qr-hint{
    font-size:12px;
    color:var(--muted);
    margin:0;
    text-align:center;
  }
  .link-row{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .link-box{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--accent);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-shadow:inset 0 1px 3px var(--shadow);
    transition:background-color .25s ease;
  }
  .copy-btn{
    flex-shrink:0;
    background:var(--btn-grad);
    border:none;
    color:#062012;
    border-radius:14px;
    padding:0 18px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    box-shadow:0 4px 16px rgba(var(--signal-rgb),0.28);
    transition:background-color .2s ease, transform .15s ease, box-shadow .15s ease;
  }
  .copy-btn:active{ transform:scale(0.94); }
  .copy-btn.copied{
    background:var(--signal-dim);
    color:#0A0F1A;
    animation:copyPop .35s ease;
  }
  .copy-btn .check-ico{
    display:none;
    width:14px; height:14px;
    animation:checkIn .3s ease;
  }
  .copy-btn.copied .check-ico{ display:block; }
  @keyframes copyPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }
  @keyframes checkIn{
    0%{ transform:scale(0) rotate(-20deg); opacity:0; }
    60%{ transform:scale(1.2) rotate(0deg); opacity:1; }
    100%{ transform:scale(1); }
  }
  .link-box.flash{ animation:linkFlash .5s ease; }
  @keyframes linkFlash{
    0%{ background:rgba(var(--signal-rgb),0.20); }
    100%{ background:var(--panel-2); }
  }

  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:18px 0;
  }

  .instr-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    margin:0 0 6px;
  }
  .instr-note{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin:0 0 14px;
  }
  .app-block{
    margin-bottom:14px;
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    background:var(--panel-grad);
    box-shadow:var(--card-shadow);
  }
  .app-block:last-child{ margin-bottom:0; }
  .app-name{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    color:var(--accent);
    margin:0 0 8px;
  }
  .app-steps{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .app-steps li{
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
    display:flex;
    gap:8px;
  }
  .app-steps li::before{
    content:'•';
    color:var(--signal-dim);
    flex-shrink:0;
  }
  /* Store badge button: shows which store (Google Play / App Store) the
     link points to for the currently selected device, so there's no
     ambiguity about where the tap will take the user. */
  .open-app-btn{

  // Also copy the subscription link to the clipboard when an "Open" button
  // is tapped, so it's ready to paste via "+" -> "From Clipboard" inside

  function copyToClipboardSilently(text){

  }

  // Tries to open the app via its deep link and import the subscription
  // automatically. If the page is still visible after a short delay
  // (meaning the OS never switched away to open the app), we assume it
  // isn't installed and send the user to the matching store page instead.
  function openAppOrGoToStore(deepLink, storeUrl){
    let didHide = false;
    function onVisibilityChange(){ if(document.hidden) didHide = true; }
    document.addEventListener('visibilitychange', onVisibilityChange);

    window.location.href = deepLink;

    setTimeout(()=>{
      document.removeEventListener('visibilitychange', onVisibilityChange);
      if(!didHide && storeUrl){
        window.location.href = storeUrl;
      }
    }, 1500);
  }

  //    launch the app directly and auto-import the link; fall back to
  //    that device's store only if the app isn't installed.
  //  - Doesn't match (e.g. picked iPhone while browsing on Android) ->
  //    never attempt to launch anything on this device, just go straight
  //    to the store page for the phone they picked.
  function handleOpenAppClick(e, deepLink, storeUrlsByOs){

  // ---- Light/Dark theme: follows system setting by default, ----
  // ---- button lets the user override + remembers the choice. ----
  (function initTheme(){
    const THEME_KEY = 'vedavpn_theme';
    const mq = window.matchMedia('(prefers-color-scheme: light)');

    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
    }

    function currentTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      if(saved === 'light' || saved === 'dark') return saved;
      return mq.matches ? 'light' : 'dark';
    }

    applyTheme(currentTheme());

    // If the user hasn't manually overridden, keep following the system.
    mq.addEventListener('change', (e)=>{
      if(!localStorage.getItem(THEME_KEY)){
        applyTheme(e.matches ? 'light' : 'dark');
      }
    });

    function toggleTheme(){
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    }

    document.getElementById('themeToggleLang').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleMain').addEventListener('click', toggleTheme);
  })();

  // ---- Live, real visitor counter ----
  // Backend: CountAPI (countapi.mileshilliard.com) — free, public, no signup,
  // no keys. Each unique visitor (identified by an id stored in localStorage)
  // counts ONCE, ever. Reopening or refreshing the page will NOT increment
  // the counter again — it will just show the current total.
  //
  // The counter key just needs to be unique so nobody else's counter
  // collides with ours. No account or setup is needed — the key is created
  // automatically the first time it's hit.
  (async function trackRealVisit(){
    const statEl = document.getElementById('stat1Num');
    const VISITED_KEY = 'vedavpn_visitor_id';
    const COUNTER_BASE = 'https://countapi.mileshilliard.com/api/v1';
    const COUNTER_KEY = 'vedavpn_lol_unique_visitors_2026';

    function renderValue(value){
      if(typeof value === 'number' && !isNaN(value)){
        statEl.textContent = value.toLocaleString('en-US');
      } else {
        statEl.textContent = '—';
      }
    }

    // Guards against the request hanging forever if the service is slow
    // or unreachable — fails fast instead of leaving the counter stuck.
    async function fetchWithTimeout(url, timeoutMs = 8000){
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try{
        return await fetch(url, { signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    try{
      let visitorId = localStorage.getItem(VISITED_KEY);
      const isNewVisitor = !visitorId;

      if(isNewVisitor){
        // Generate and persist a unique id for this visitor so future
        // visits (refresh, reopen, etc.) are recognized and skipped.
        visitorId = (crypto && crypto.randomUUID) ? crypto.randomUUID() :
          'v-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        localStorage.setItem(VISITED_KEY, visitorId);
      }

      // New visitor -> increment the shared counter once ("hit").
      // Returning visitor -> only read the current value, don't increment ("get").
      const res = isNewVisitor
        ? await fetchWithTimeout(`${COUNTER_BASE}/hit/${COUNTER_KEY}`)
        : await fetchWithTimeout(`${COUNTER_BASE}/get/${COUNTER_KEY}`);
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      const value = (data && data.value != null) ? parseInt(data.value, 10) : null;
      renderValue(value);
    }catch(e){
      renderValue(null);
    }
  })();

  // ---- Reviews & star ratings (shared across all visitors via Firebase Firestore) ----
  // Backend: your own Firebase project — free tier, no expiry, data lives
  // permanently until you delete it yourself.
  //
  // ONE-TIME SETUP (see chat for the 3 steps): paste your project's
  // firebaseConfig below, replacing the placeholder object.
  (function reviewsModule(){
    const firebaseConfig = {
      apiKey: "AIzaSyBL--Cf68JvuQmzsu1u8xcTS5Euzp0JfLQ",
      authDomain: "veda--vpn.firebaseapp.com",
      projectId: "veda--vpn",
      storageBucket: "veda--vpn.firebasestorage.app",
      messagingSenderId: "669348180612",
      appId: "1:669348180612:web:74d641cc60c17a6a9048d1",
      measurementId: "G-R3124S7M07"
    };
    // Wrapped defensively: some sandboxed preview environments block
    // loading the Firebase SDK from gstatic.com, which would otherwise
    // throw an uncaught error and break the whole page. On your real
    // site (vedavpn.lol) this always succeeds normally.
    let reviewsCol = null;
    try {
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        reviewsCol = firebase.firestore().collection('reviews');
      }
    } catch (e) {
      reviewsCol = null;
    }

    function updateStarButtons(){
      el.reviewStarsPicker.querySelectorAll('.star-btn').forEach(btn=>{
        btn.classList.toggle('active', parseInt(btn.dataset.star, 10) <= selectedStars);
      });
    }

    el.reviewStarsPicker.querySelectorAll('.star-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        selectedStars = parseInt(btn.dataset.star, 10);
        updateStarButtons();
        el.reviewStarsLabel.textContent = dict[lang].reviewStarsHint(selectedStars);
      });
    });

    async function fetchReviews(){
      if (!reviewsCol) {
        reviewsCache = reviewsCache || [];
        renderReviewsSummary();
        renderReviewsList();
        return;
      }
      try{
        const snapshot = await reviewsCol.orderBy('createTime', 'desc').limit(200).get();
        reviewsCache = snapshot.docs.map(doc => {
          const data = doc.data();
          return {
            text: data.text,
            rating: data.rating,
            createTime: data.createTime && data.createTime.toDate
              ? data.createTime.toDate().toISOString()
              : new Date().toISOString()
          };
        });
      }catch(e){
        reviewsCache = reviewsCache || [];
      }
      renderReviewsSummary();
      renderReviewsList();
    }

    // ---- Anti-spam constants ----
    const REVIEW_COOLDOWN_MS = 6 * 60 * 60 * 1000; // 6 hours between reviews per device
    const LAST_REVIEW_KEY = 'vedavpn_last_review_ts';
    const URL_PATTERN = /https?:\/\/|www\.|t\.me\//i;

    function isSpammyText(text){
      if(text.length < 3) return true;
      // Same character repeated through most of the text (e.g. "aaaaaaaaaa")
      const mostCommonCharRatio = (()=>{
        const counts = {};
        for(const ch of text) counts[ch] = (counts[ch]||0) + 1;
        return Math.max(...Object.values(counts)) / text.length;
      })();
      if(mostCommonCharRatio > 0.6 && text.length > 6) return true;
      if(URL_PATTERN.test(text)) return true;
      return false;
    }

    el.reviewSubmitBtn.addEventListener('click', async ()=>{
      const d = dict[lang];
      const text = el.reviewText.value.trim();

      // Honeypot: real users never fill this hidden field. If it's filled,
      // silently pretend success without ever writing to Firestore.
      if(el.reviewWebsite.value.trim() !== ''){
        el.reviewText.value = '';
        el.reviewWebsite.value = '';
        selectedStars = 0;
        updateStarButtons();
        el.reviewStarsLabel.textContent = d.reviewStarsHint(0);
        el.reviewStatus.textContent = d.reviewOk;
        el.reviewStatus.className = 'review-status ok';
        setTimeout(()=>{ el.reviewStatus.textContent=''; el.reviewStatus.className='review-status'; }, 4000);
        return;
      }

      if(!text || selectedStars < 1){
        el.reviewStatus.textContent = d.reviewErrEmpty;
        el.reviewStatus.className = 'review-status err';
        return;
      }

      if(isSpammyText(text)){
        el.reviewStatus.textContent = d.reviewErrSpam;
        el.reviewStatus.className = 'review-status err';
        return;
      }

      const lastTs = parseInt(localStorage.getItem(LAST_REVIEW_KEY) || '0', 10);
      const msLeft = REVIEW_COOLDOWN_MS - (Date.now() - lastTs);
      if(msLeft > 0){
        el.reviewStatus.textContent = d.reviewErrCooldown(Math.ceil(msLeft / (60*60*1000)));
        el.reviewStatus.className = 'review-status err';
        return;
      }

      if(!reviewsCol){
        el.reviewStatus.textContent = d.reviewErrFail;
        el.reviewStatus.className = 'review-status err';
        return;
      }
      el.reviewSubmitBtn.disabled = true;
      el.reviewStatus.textContent = d.reviewSending;
      el.reviewStatus.className = 'review-status';
      try{
        await reviewsCol.add({
          text: text.slice(0, 500),
          rating: selectedStars,
          createTime: firebase.firestore.FieldValue.serverTimestamp()
        });
        localStorage.setItem(LAST_REVIEW_KEY, String(Date.now()));
        el.reviewText.value = '';
        selectedStars = 0;
        updateStarButtons();
        el.reviewStarsLabel.textContent = dict[lang].reviewStarsHint(0);
        el.reviewStatus.textContent = d.reviewOk;
        el.reviewStatus.className = 'review-status ok';
        await fetchReviews();
      }catch(e){
        el.reviewStatus.textContent = d.reviewErrFail;
        el.reviewStatus.className = 'review-status err';
      }finally{
        el.reviewSubmitBtn.disabled = false;
        setTimeout(()=>{
          el.reviewStatus.textContent = '';
          el.reviewStatus.className = 'review-status';
        }, 4000);
      }
    });

    fetchReviews();
  })();
})();

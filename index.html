        { q: 'Հղումն այլևս չի աշխատում, ի՞նչ անել', a: 'Ստուգիր ընթացիկ հղումը հենց այս բոտում, կամ գրիր support-ին @vedavpn_bot-ի միջոցով։' },
        { q: 'Ո՞ր հավելվածն է ավելի լավ', a: 'Խորհուրդ ենք տալիս Happ կամ INCY — երկուսն էլ աջակցում են այս հղումին և հեշտ են կարգավորել։' }
      ]
    },
    en: {
      eyebrow: 'Network active',
      heroTitle: 'Fast and secure VPN',
      heroSub: 'Tap the button below to get your link and connect within a minute.',
      feat1: 'No logs', feat2: 'High speed', feat3: 'Servers worldwide',
      stat1: 'site visitors', stat2: 'servers', stat3: 'uptime',
      cta: '🔓 Get VPN',
      revealTitle: 'Your VPN link',
      copy: 'Copy', copied: 'Copied ✓',
      instrTitle: '📖 How to add the VPN link',
      step1: 'First copy the VPN link by tapping the "Copy" button above',
      happ: [
        'Open Happ',
        'Tap "+" in the top right corner',
        'Choose "Add from Clipboard" or "Import from URL"',
        'Confirm (the link is already in your clipboard)',
        'Pick a server from the list and tap Connect'
      ],
      incy: [
        'Open INCY',
        'Tap "+"',
        'Choose "Paste from Clipboard" or "Add Subscription"',
        'Confirm the link',
        'Pick a server and connect'
      ],
      tipChannel: 'Channel', tipBot: 'Bot', tipForum: 'Forum',
      langPrompt: 'Выберите язык / Ընտրեք լեզուն / Choose language',
      faqHeading: '❓ Frequently asked questions',
      faq: [
        { q: 'Is the link the same for everyone?', a: 'Yes, right now all users share the same VPN link. Individual links will be added later.' },
        { q: 'Do I need to pay?', a: 'The VPN is currently free. Follow the channel for any updates.' },
        { q: 'The link stopped working, what do I do?', a: 'Check the current link right here in this bot, or contact support via @vedavpn_bot.' },
        { q: 'Which app should I use?', a: 'We recommend Happ or INCY — both support this link and are easy to set up.' }
      ]
    }
  };

  let lang = localStorage.getItem('vedavpn_lang') || null;

  const el = {
    langScreen: document.getElementById('langScreen'),
    mainScreen: document.getElementById('mainScreen'),
    eyebrowText: document.getElementById('eyebrowText'),
    heroTitle: document.getElementById('heroTitle'),
    heroSub: document.getElementById('heroSub'),
    stat1: document.getElementById('stat1'),
    stat2: document.getElementById('stat2'),
    stat3: document.getElementById('stat3'),
    feat1: document.getElementById('feat1'),
    feat2: document.getElementById('feat2'),
    feat3: document.getElementById('feat3'),
    ctaBtn: document.getElementById('ctaBtn'),
    revealPanel: document.getElementById('revealPanel'),
    revealTitle: document.getElementById('revealTitle'),
    linkBox: document.getElementById('linkBox'),
    copyBtn: document.getElementById('copyBtn'),
    instrTitle: document.getElementById('instrTitle'),
    step1Text: document.getElementById('step1Text'),
    happSteps: document.getElementById('happSteps'),
    incySteps: document.getElementById('incySteps'),
    tipChannel: document.getElementById('tipChannel'),
    tipBot: document.getElementById('tipBot'),
    tipForum: document.getElementById('tipForum'),
    faqHeading: document.getElementById('faqHeading'),
    faqList: document.getElementById('faqList'),
  };

  function renderFaq(){
    const d = dict[lang];
    el.faqHeading.textContent = d.faqHeading;
    el.faqList.innerHTML = d.faq.map((item, i) => `
      <div class="faq-item" data-idx="${i}">
        <button class="faq-q" type="button">
          <span>${item.q}</span>
          <span class="chev">⌄</span>
        </button>
        <div class="faq-a"><p>${item.a}</p></div>
      </div>
    `).join('');
    el.faqList.querySelectorAll('.faq-q').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btn.closest('.faq-item').classList.toggle('open');
      });
    });
  }

  function renderMain(){
    const d = dict[lang];
    el.eyebrowText.textContent = d.eyebrow;
    el.heroTitle.textContent = d.heroTitle;
    el.heroSub.textContent = d.heroSub;
    el.stat1.textContent = d.stat1;
    el.stat2.textContent = d.stat2;
    el.stat3.textContent = d.stat3;
    el.feat1.textContent = d.feat1;
    el.feat2.textContent = d.feat2;
    el.feat3.textContent = d.feat3;
    el.ctaBtn.textContent = d.cta;
    el.revealTitle.textContent = d.revealTitle;
    el.linkBox.textContent = subUrl;
    el.copyBtn.textContent = d.copy;
    el.instrTitle.textContent = d.instrTitle;
    el.step1Text.textContent = d.step1;
    el.happSteps.innerHTML = d.happ.map(s=>`<li>${s}</li>`).join('');
    el.incySteps.innerHTML = d.incy.map(s=>`<li>${s}</li>`).join('');
    el.tipChannel.textContent = d.tipChannel;
    el.tipBot.textContent = d.tipBot;
    el.tipForum.textContent = d.tipForum;
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-switch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    renderFaq();
  }

  function showMain(){
    el.langScreen.style.display = 'none';
    el.mainScreen.style.display = 'flex';
    renderMain();
  }

  document.querySelectorAll('#langScreen .lang-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      lang = b.dataset.lang;
      localStorage.setItem('vedavpn_lang', lang);
      showMain();
    });
  });

  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.addEventListener('click', ()=>{
      lang = b.dataset.lang;
      localStorage.setItem('vedavpn_lang', lang);
      renderMain();
    });
  });

  el.ctaBtn.addEventListener('click', ()=>{
    el.revealPanel.classList.toggle('open');
    if(el.revealPanel.classList.contains('open')){
      setTimeout(()=>{ el.revealPanel.scrollIntoView({ behavior:'smooth', block:'nearest' }); }, 150);
    }
  });

  el.copyBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(subUrl);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = subUrl; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    el.copyBtn.textContent = dict[lang].copied;
    el.copyBtn.classList.add('copied');
    setTimeout(()=>{
      el.copyBtn.textContent = dict[lang].copy;
      el.copyBtn.classList.remove('copied');
    }, 2000);
  });

  if(lang){ showMain(); }

  // ---- Live, real visitor counter (no signup, public free API) ----
  // Each unique visitor (identified by an id stored in localStorage) counts
  // ONCE, ever. Reopening or refreshing the page will NOT increment the
  // counter again — it will just show the current total.
  (async function trackRealVisit(){
    const statEl = document.getElementById('stat1Num');
    const VISITED_KEY = 'vedavpn_visitor_id';

    function renderValue(value){
      if(typeof value === 'number'){
        statEl.textContent = value.toLocaleString('en-US');
      } else {
        statEl.textContent = '—';
      }
    }

    try{
      let visitorId = localStorage.getItem(VISITED_KEY);
      const isNewVisitor = !visitorId;

      if(isNewVisitor){
        // Generate and persist a unique id for this visitor so future
        // visits (refresh, reopen, etc.) are recognized and skipped.
        visitorId = (crypto && crypto.randomUUID) ? crypto.randomUUID() :
          'v-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        localStorage.setItem(VISITED_KEY, visitorId);
      }

      // New visitor -> increment the shared counter once.
      // Returning visitor -> only read the current value, don't increment.
      const endpoint = isNewVisitor
        ? 'https://countapi.mileshilliard.com/api/v1/hit/vedavpn-lol-site-visits'
        : 'https://countapi.mileshilliard.com/api/v1/get/vedavpn-lol-site-visits';

      const res = await fetch(endpoint);
      const data = await res.json();
      renderValue(data && data.value);
    }catch(e){
      renderValue(null);
    }
  })();
})();
</script>

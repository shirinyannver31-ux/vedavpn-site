<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VedaVPN</title>
<meta property="og:title" content="VedaVPN — Fast &amp; Secure VPN">
<meta property="og:description" content="Get your free VPN link in seconds. No logs, high speed, servers worldwide.">
<meta property="og:image" content="https://vedavpn.lol/og-image.png">
<meta property="og:url" content="https://vedavpn.lol/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VedaVPN — Fast &amp; Secure VPN">
<meta name="twitter:description" content="Get your free VPN link in seconds. No logs, high speed, servers worldwide.">
<meta name="twitter:image" content="https://vedavpn.lol/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0A0F1A;
    --panel:     #10182B;
    --panel-2:   #131D33;
    --line:      #212B42;
    --signal:    #39FF9E;
    --signal-dim:#1D8F60;
    --accent:    #6EA8FE;
    --text:      #ECEFF4;
    --muted:     #838DA3;
    --bg-glow:   rgba(57,255,158,0.07);
    --bg-lines:  rgba(255,255,255,0.015);
    --shadow:    rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --bg:        #F3F6FB;
    --panel:     #FFFFFF;
    --panel-2:   #FFFFFF;
    --line:      #DDE4EF;
    --signal:    #17A968;
    --signal-dim:#0E8A54;
    --accent:    #2B6CE0;
    --text:      #101623;
    --muted:     #6A7488;
    --bg-glow:   rgba(23,169,104,0.08);
    --bg-lines:  rgba(16,22,35,0.03);
    --shadow:    rgba(16,22,35,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    transition:background-color .25s ease, color .25s ease;
    background-image:
      radial-gradient(circle at 50% 0%, var(--bg-glow), transparent 55%),
      repeating-linear-gradient(0deg, var(--bg-lines) 0px, var(--bg-lines) 1px, transparent 1px, transparent 32px);
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:28px 20px 100px;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Language picker screen ---------- */
  #langScreen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    text-align:center;
  }
  .logo-mark{
    width:64px; height:64px;
    border-radius:18px;
    background:linear-gradient(160deg, #16233d, #0d1526);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .logo-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .logo-mark svg{ width:28px; height:28px; }

  /* ---------- Theme toggle ---------- */
  .theme-toggle{
    width:30px; height:30px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:border-color .15s ease, transform .1s ease;
  }
  .theme-toggle:active{ transform:scale(0.92); }
  .theme-toggle:hover{ border-color:var(--signal-dim); }
  .theme-toggle svg{ width:16px; height:16px; }
  .theme-toggle .icon-moon{ display:block; }
  .theme-toggle .icon-sun{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  .lang-screen-top{
    position:absolute;
    top:20px; right:20px;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .brand span{ color:var(--signal); }
  .lang-prompt{
    color:var(--muted);
    font-size:14px;
    margin:0;
  }
  .lang-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
  }
  .lang-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:15px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .lang-btn:active{ transform:scale(0.98); }
  .lang-btn:hover{ border-color:var(--signal-dim); }
  .flag{ font-size:20px; }

  /* ---------- Main app screen ---------- */
  #mainScreen{ display:none; flex:1; flex-direction:column; }
  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .top-row .brand{ font-size:20px; }
  .top-row-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-mark-sm{
    width:34px; height:34px;
    border-radius:9px;
    overflow:hidden;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .logo-mark-sm img{ width:100%; height:100%; object-fit:cover; display:block; }
  .lang-switch{
    display:flex; gap:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
  }
  .lang-switch button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:4px 8px;
    border-radius:6px;
    cursor:pointer;
  }
  .lang-switch button.active{ color:var(--signal); border-color:var(--signal-dim); }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 8px var(--signal);
    animation:blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .hero-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:22px;
    line-height:1.35;
    margin:0 0 8px;
  }
  .hero-sub{
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
    margin:0 0 26px;
  }

  /* ---------- Stats row ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 8px;
    text-align:center;
  }
  .stat .num{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--signal);
    margin-bottom:2px;
  }
  .stat .label{
    font-size:10px;
    color:var(--muted);
    line-height:1.3;
  }

  .features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:28px;
  }
  .feature{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
  }
  .feature .ico{ font-size:18px; margin-bottom:6px; }
  .feature .label{
    font-size:10.5px;
    color:var(--muted);
    line-height:1.3;
  }

  .cta-btn{
    width:100%;
    border:none;
    border-radius:16px;
    padding:18px 20px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:17px;
    background:var(--signal);
    color:#062012;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:transform .12s ease;
  }
  .cta-btn:active{ transform:scale(0.98); }

  /* ---------- Reveal panel ---------- */
  #revealPanel{
    margin-top:18px;
    max-height:0;
    overflow:hidden;
    transition:max-height .4s ease;
  }
  #revealPanel.open{ max-height:1200px; }
  .reveal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 20px;
    margin-top:4px;
  }
  .reveal-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .reveal-title .pulse{
    width:8px; height:8px; border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 8px var(--signal);
  }
  .link-row{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .link-box{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--accent);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:background-color .25s ease;
  }
  .copy-btn{
    flex-shrink:0;
    background:var(--signal);
    border:none;
    color:#062012;
    border-radius:10px;
    padding:0 18px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:background-color .2s ease, transform .15s ease;
  }
  .copy-btn:active{ transform:scale(0.94); }
  .copy-btn.copied{
    background:var(--signal-dim);
    color:#0A0F1A;
    animation:copyPop .35s ease;
  }
  .copy-btn .check-ico{
    display:none;
    width:14px; height:14px;
    animation:checkIn .3s ease;
  }
  .copy-btn.copied .check-ico{ display:block; }
  @keyframes copyPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }
  @keyframes checkIn{
    0%{ transform:scale(0) rotate(-20deg); opacity:0; }
    60%{ transform:scale(1.2) rotate(0deg); opacity:1; }
    100%{ transform:scale(1); }
  }
  .link-box.flash{ animation:linkFlash .5s ease; }
  @keyframes linkFlash{
    0%{ background:rgba(57,255,158,0.20); }
    100%{ background:var(--panel-2); }
  }

  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:18px 0;
  }

  .instr-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    margin:0 0 14px;
  }
  .app-block{ margin-bottom:16px; }
  .app-block:last-child{ margin-bottom:0; }
  .app-name{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--accent);
    margin:0 0 8px;
  }
  .app-steps{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .app-steps li{
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
    display:flex;
    gap:8px;
  }
  .app-steps li::before{
    content:'•';
    color:var(--signal-dim);
    flex-shrink:0;
  }
  .open-app-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:10px;
    padding:9px 16px;
    border-radius:10px;
    border:1px solid var(--signal-dim);
    background:rgba(57,255,158,0.08);
    color:var(--signal);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:12.5px;
    text-decoration:none;
    cursor:pointer;
    transition:transform .12s ease, background-color .15s ease;
  }
  .open-app-btn:active{ transform:scale(0.96); }
  .open-app-btn:hover{ background:rgba(57,255,158,0.14); }
  .step-1{
    font-size:13px;
    color:var(--text);
    background:rgba(57,255,158,0.07);
    border:1px solid var(--signal-dim);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:16px;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }

  /* ---------- Device type picker ---------- */
  .device-picker{ margin-bottom:18px; }
  .device-picker-label{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 8px;
  }
  .device-switch{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .device-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13.5px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .device-btn:active{ transform:scale(0.97); }
  .device-btn.active{
    color:var(--signal);
    border-color:var(--signal-dim);
    background:rgba(57,255,158,0.08);
  }

  /* ---------- FAQ ---------- */
  .faq-section{ margin-top:30px; }
  .faq-heading{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 12px;
  }
  .faq-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .faq-q{
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13.5px;
    padding:14px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .faq-q .chev{
    color:var(--muted);
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .faq-item.open .faq-q .chev{ transform:rotate(180deg); }
  .faq-a{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .faq-item.open .faq-a{ max-height:300px; }
  .faq-a p{
    margin:0;
    padding:0 16px 14px;
    font-size:13px;
    color:var(--muted);
    line-height:1.55;
  }

  /* ---------- Reviews ---------- */
  .reviews-section{ margin-top:30px; }
  .reviews-heading{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 4px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .reviews-summary{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
  }
  .reviews-summary .avg-stars{ color:#F5B93D; letter-spacing:1px; }
  .reviews-summary .avg-num{ color:var(--text); font-weight:600; }

  .review-form{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin:14px 0 18px;
  }
  .review-form textarea{
    width:100%;
    min-height:70px;
    resize:vertical;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:10px 12px;
    box-sizing:border-box;
  }
  .review-form textarea:focus{ outline:none; border-color:var(--signal-dim); }
  .review-stars-picker{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
  }
  .review-stars-picker .stars{
    display:flex;
    gap:4px;
  }
  .review-stars-picker .star-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:22px;
    line-height:1;
    color:var(--line);
    padding:0;
    transition:transform .1s ease, color .15s ease;
  }
  .review-stars-picker .star-btn:active{ transform:scale(0.85); }
  .review-stars-picker .star-btn.active{ color:#F5B93D; }
  .review-stars-label{
    font-size:12px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
  }
  .review-submit-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
  }
  .review-submit-btn{
    background:var(--signal);
    border:none;
    color:#062012;
    border-radius:10px;
    padding:9px 20px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease;
  }
  .review-submit-btn:active{ transform:scale(0.95); }
  .review-submit-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .review-status{
    font-size:12px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
  }
  .review-status.ok{ color:var(--signal); }
  .review-status.err{ color:#FF6B6B; }

  .review-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .review-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .review-card .review-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:6px;
  }
  .review-card .review-stars{
    color:#F5B93D;
    font-size:14px;
    letter-spacing:1px;
  }
  .review-card .review-date{
    font-size:11px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
  }
  .review-card .review-text{
    font-size:13px;
    color:var(--text);
    line-height:1.5;
    margin:0;
    word-wrap:break-word;
  }
  .review-empty, .review-loading{
    font-size:13px;
    color:var(--muted);
    padding:6px 2px;
  }

  /* ---------- Floating footer links ---------- */
  .float-links{
    position:fixed;
    right:16px;
    bottom:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:20;
  }
  .float-links a{
    width:46px; height:46px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:var(--text);
    font-size:19px;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    transition:border-color .15s ease, transform .12s ease;
  }
  .float-links a:active{ transform:scale(0.94); }
  .float-links a:hover{ border-color:var(--signal-dim); }
  .float-links .tip{
    position:absolute;
    right:56px;
    top:50%;
    transform:translateY(-50%);
    background:var(--panel-2);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:8px;
    font-size:11px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .float-links a{ position:relative; }
  .float-links a:hover .tip{ opacity:1; }

  @media (prefers-reduced-motion: reduce){ .dot{ animation:none; } }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== Language picker ===== -->
  <div id="langScreen">
    <button class="theme-toggle lang-screen-top" id="themeToggleLang" type="button" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <div class="logo-mark">
      <img src="veda-logo.png" alt="VedaVPN">
    </div>
    <h1 class="brand">Veda<span>VPN</span></h1>
    <p class="lang-prompt" id="langPromptText">Выберите язык / Ընտրեք լեզուն / Choose language</p>

    const d = dict[lang];
    el.faqHeading.textContent = d.faqHeading;
    el.faqList.innerHTML = d.faq.map((item, i) => `
      <div class="faq-item" data-idx="${i}">
        <button class="faq-q" type="button">
          <span>${item.q}</span>
          <span class="chev">⌄</span>
        </button>
        <div class="faq-a"><p>${item.a}</p></div>
      </div>
    `).join('');
    el.faqList.querySelectorAll('.faq-q').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btn.closest('.faq-item').classList.toggle('open');
      });
    });
  }

  function renderReviewStrings(){
    const d = dict[lang];
    el.reviewsHeading.textContent = d.reviewsHeading;
    el.reviewText.placeholder = d.reviewPlaceholder;
    el.reviewSubmitBtn.textContent = d.reviewSubmit;
    el.reviewStarsLabel.textContent = d.reviewStarsHint(selectedStars);
    renderReviewsSummary();
    renderReviewsList();
  }

  function renderReviewsSummary(){
    const d = dict[lang];
    if(!reviewsCache || reviewsCache.length === 0){
      el.reviewsSummary.innerHTML = '';
      return;
    }
    const avg = reviewsCache.reduce((s, r)=> s + r.rating, 0) / reviewsCache.length;
    const rounded = Math.round(avg * 10) / 10;
    const fullStars = Math.round(avg);
    const starsStr = '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);
    el.reviewsSummary.innerHTML =
      `<span class="avg-stars">${starsStr}</span> <span class="avg-num">${rounded}</span> ${d.reviewsAvgUnit} · ${reviewsCache.length} ${d.reviewsCountWord(reviewsCache.length)}`;
  }

  function renderReviewsList(){
    const d = dict[lang];
    if(reviewsCache === null){
      el.reviewList.innerHTML = `<div class="review-loading">${d.reviewLoading}</div>`;
      return;
    }
    if(reviewsCache.length === 0){
      el.reviewList.innerHTML = `<div class="review-empty">${d.reviewEmpty}</div>`;
      return;
    }
    const localeMap = { ru: 'ru-RU', hy: 'hy-AM', en: 'en-US' };
    el.reviewList.innerHTML = reviewsCache.map(()=>
      `<div class="review-card">
        <div class="review-top">
          <span class="review-stars"></span>
          <span class="review-date"></span>
        </div>
        <p class="review-text"></p>
      </div>`
    ).join('');
    const cards = el.reviewList.querySelectorAll('.review-card');
    cards.forEach((card, i)=>{
      const r = reviewsCache[i];
      card.querySelector('.review-stars').textContent = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
      card.querySelector('.review-date').textContent = r.createTime
        ? new Date(r.createTime).toLocaleDateString(localeMap[lang] || 'en-US', { day: '2-digit', month: 'short' })
        : '';
      card.querySelector('.review-text').textContent = r.text;
    });
  }

  function renderMain(){
    const d = dict[lang];
    el.eyebrowText.textContent = d.eyebrow;
    el.heroTitle.textContent = d.heroTitle;
    el.heroSub.textContent = d.heroSub;
    el.stat1.textContent = d.stat1;
    el.stat2.textContent = d.stat2;
    el.stat3.textContent = d.stat3;
    el.feat1.textContent = d.feat1;
    el.feat2.textContent = d.feat2;
    el.feat3.textContent = d.feat3;
    el.ctaBtn.textContent = d.cta;
    el.revealTitle.textContent = d.revealTitle;
    el.linkBox.textContent = subUrl;
    el.copyBtnText.textContent = d.copy;
    el.instrTitle.textContent = d.instrTitle;
    el.step1Text.textContent = d.step1;
    el.happSteps.innerHTML = d.happ.map(s=>`<li>${s}</li>`).join('');
    el.incySteps.innerHTML = d.incy.map(s=>`<li>${s}</li>`).join('');
    el.openHappBtnText.textContent = d.openHapp;
    el.openIncyBtnText.textContent = d.openIncy;
    el.openHappBtn.href = happDeepLink;
    el.openIncyBtn.href = incyDeepLink;
    el.devicePickerLabel.textContent = d.devicePickerLabel;
    el.deviceBtnAndroidText.textContent = d.deviceAndroid;
    el.deviceBtnIosText.textContent = d.deviceIOS;
    renderDevicePicker();
    el.tipChannel.textContent = d.tipChannel;
    el.tipBot.textContent = d.tipBot;
    el.tipForum.textContent = d.tipForum;
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-switch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    renderFaq();
    renderReviewStrings();
  }

  function showMain(){
    el.langScreen.style.display = 'none';
    el.mainScreen.style.display = 'flex';
    renderMain();
  }

  document.querySelectorAll('#langScreen .lang-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      lang = b.dataset.lang;
      localStorage.setItem('vedavpn_lang', lang);
      showMain();
    });
  });

  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.addEventListener('click', ()=>{
      lang = b.dataset.lang;
      localStorage.setItem('vedavpn_lang', lang);
      renderMain();
    });
  });

  el.ctaBtn.addEventListener('click', ()=>{
    el.revealPanel.classList.toggle('open');
    if(el.revealPanel.classList.contains('open')){
      setTimeout(()=>{ el.revealPanel.scrollIntoView({ behavior:'smooth', block:'nearest' }); }, 150);
    }
  });

  // Also copy the subscription link to the clipboard when an "Open in X"
  // button is tapped. If the deep link fails to launch the app (not
  // installed, or the URI scheme is blocked in some in-app browser), the
  // link is still in the clipboard so the user can fall back to
  // "+" -> "From Clipboard" inside the app, per each app's own instructions.
  function copyToClipboardSilently(text){
    try{
      navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
    }catch(e){ /* ignore */ }
  }
  // Tapping "Open in Happ / INCY": copy the link to clipboard as a safety
  // net, try to launch the app via deep link, and fall back to the store
  // page if the app doesn't open.
  function handleOpenAppClick(e, deepLink, storeUrlsByOs){
    e.preventDefault();
    copyToClipboardSilently(subUrl);
    openAppOrRedirectToStore(deepLink, storeUrlsByOs);
  }
  el.openHappBtn.addEventListener('click', (e)=>{ handleOpenAppClick(e, happDeepLink, storeLinks.happ); });
  el.openIncyBtn.addEventListener('click', (e)=>{ handleOpenAppClick(e, incyDeepLink, storeLinks.incy); });

  el.deviceBtnAndroid.addEventListener('click', ()=>{
    selectedDevice = 'android';
    localStorage.setItem('vedavpn_device', selectedDevice);
    renderDevicePicker();
  });
  el.deviceBtnIos.addEventListener('click', ()=>{
    selectedDevice = 'ios';
    localStorage.setItem('vedavpn_device', selectedDevice);
    renderDevicePicker();
  });

  el.copyBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(subUrl);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = subUrl; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    el.copyBtnText.textContent = dict[lang].copied;
    el.copyBtn.classList.add('copied');
    el.linkBox.classList.remove('flash');
    void el.linkBox.offsetWidth; // restart animation
    el.linkBox.classList.add('flash');
    setTimeout(()=>{
      el.copyBtnText.textContent = dict[lang].copy;
      el.copyBtn.classList.remove('copied');
    }, 2000);
  });

  if(lang){ showMain(); }

  // ---- Light/Dark theme: follows system setting by default, ----
  // ---- button lets the user override + remembers the choice. ----
  (function initTheme(){
    const THEME_KEY = 'vedavpn_theme';
    const mq = window.matchMedia('(prefers-color-scheme: light)');

    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
    }

    function currentTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      if(saved === 'light' || saved === 'dark') return saved;
      return mq.matches ? 'light' : 'dark';
    }

    applyTheme(currentTheme());

    // If the user hasn't manually overridden, keep following the system.
    mq.addEventListener('change', (e)=>{
      if(!localStorage.getItem(THEME_KEY)){
        applyTheme(e.matches ? 'light' : 'dark');
      }
    });

    function toggleTheme(){
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    }

    document.getElementById('themeToggleLang').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleMain').addEventListener('click', toggleTheme);
  })();

  // ---- Live, real visitor counter (no signup, public free API) ----
  // Each unique visitor (identified by an id stored in localStorage) counts
  // ONCE, ever. Reopening or refreshing the page will NOT increment the
  // counter again — it will just show the current total.
  (async function trackRealVisit(){
    const statEl = document.getElementById('stat1Num');
    const VISITED_KEY = 'vedavpn_visitor_id';

    function renderValue(value){
      if(typeof value === 'number'){
        statEl.textContent = value.toLocaleString('en-US');
      } else {
        statEl.textContent = '—';
      }
    }

    try{
      let visitorId = localStorage.getItem(VISITED_KEY);
      const isNewVisitor = !visitorId;

      if(isNewVisitor){
        // Generate and persist a unique id for this visitor so future
        // visits (refresh, reopen, etc.) are recognized and skipped.
        visitorId = (crypto && crypto.randomUUID) ? crypto.randomUUID() :
          'v-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        localStorage.setItem(VISITED_KEY, visitorId);
      }

      // New visitor -> increment the shared counter once.
      // Returning visitor -> only read the current value, don't increment.
      const endpoint = isNewVisitor
        ? 'https://countapi.mileshilliard.com/api/v1/hit/vedavpn-lol-site-visits-v2'
        : 'https://countapi.mileshilliard.com/api/v1/get/vedavpn-lol-site-visits-v2';

      const res = await fetch(endpoint);
      const data = await res.json();
      renderValue(data && data.value);
    }catch(e){
      renderValue(null);
    }
  })();

  // ---- Reviews & star ratings (shared across all visitors via Firebase) ----
  (function reviewsModule(){
    const FIREBASE_PROJECT_ID = 'veda--vpn';
    const FIREBASE_API_KEY = 'AIzaSyBL--Cf68JvuQmzsu1u8xcTS5Euzp0JfLQ';
    const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents`;

    function updateStarButtons(){
      el.reviewStarsPicker.querySelectorAll('.star-btn').forEach(btn=>{
        btn.classList.toggle('active', parseInt(btn.dataset.star, 10) <= selectedStars);
      });
    }

    el.reviewStarsPicker.querySelectorAll('.star-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        selectedStars = parseInt(btn.dataset.star, 10);
        updateStarButtons();
        el.reviewStarsLabel.textContent = dict[lang].reviewStarsHint(selectedStars);
      });
    });

    async function fetchReviews(){
      try{
        const res = await fetch(`${FIRESTORE_BASE}/reviews?pageSize=200&key=${FIREBASE_API_KEY}`);
        const data = await res.json();
        const docs = data.documents || [];
        reviewsCache = docs.map(doc=>{
          const f = doc.fields || {};
          return {
            text: (f.text && f.text.stringValue) || '',
            rating: (f.rating && parseInt(f.rating.integerValue, 10)) || 0,
            createTime: doc.createTime || null,
          };
        }).sort((a, b)=> new Date(b.createTime) - new Date(a.createTime));
      }catch(e){
        reviewsCache = reviewsCache || [];
      }
      renderReviewsSummary();
      renderReviewsList();
    }

    el.reviewSubmitBtn.addEventListener('click', async ()=>{
      const d = dict[lang];
      const text = el.reviewText.value.trim();
      if(!text || selectedStars < 1){
        el.reviewStatus.textContent = d.reviewErrEmpty;
        el.reviewStatus.className = 'review-status err';
        return;
      }
      el.reviewSubmitBtn.disabled = true;
      el.reviewStatus.textContent = d.reviewSending;
      el.reviewStatus.className = 'review-status';
      try{
        const body = {
          fields: {
            text: { stringValue: text.slice(0, 500) },
            rating: { integerValue: String(selectedStars) }
          }
        };
        const res = await fetch(`${FIRESTORE_BASE}/reviews?key=${FIREBASE_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if(!res.ok) throw new Error('request failed');
        el.reviewText.value = '';
        selectedStars = 0;
        updateStarButtons();
        el.reviewStarsLabel.textContent = dict[lang].reviewStarsHint(0);
        el.reviewStatus.textContent = d.reviewOk;
        el.reviewStatus.className = 'review-status ok';
        await fetchReviews();
      }catch(e){
        el.reviewStatus.textContent = d.reviewErrFail;
        el.reviewStatus.className = 'review-status err';
      }finally{
        el.reviewSubmitBtn.disabled = false;
        setTimeout(()=>{
          el.reviewStatus.textContent = '';
          el.reviewStatus.className = 'review-status';
        }, 4000);
      }
    });

    fetchReviews();
  })();
})();
</script>

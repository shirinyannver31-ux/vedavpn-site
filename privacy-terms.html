    function currentTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      if(saved === 'light' || saved === 'dark') return saved;
      return mq.matches ? 'light' : 'dark';
    }
    applyTheme(currentTheme());
    mq.addEventListener('change', (e)=>{ if(!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'light' : 'dark'); });

      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';

    });

  const LANG_KEY = 'vedavpn_lang';
  const DOC_KEY = 'vedavpn_legal_doc';
  let lang = localStorage.getItem(LANG_KEY) || 'ru';
  if(!dict[lang]) lang = 'ru';
  let doc = localStorage.getItem(DOC_KEY) || 'privacy';

  const el = {
    backText: document.getElementById('backText'),
    pageTitle: document.getElementById('pageTitle'),
    pageSub: document.getElementById('pageSub'),
    tabPrivacy: document.getElementById('tabPrivacy'),
    tabTerms: document.getElementById('tabTerms'),
    privacySection: document.getElementById('privacySection'),
    termsSection: document.getElementById('termsSection'),
    footerHome: document.getElementById('footerHome'),
    footerFaq: document.getElementById('footerFaq'),
    footerDownload: document.getElementById('footerDownload'),
    footerBot: document.getElementById('footerBot'),
    footerCopy: document.getElementById('footerCopy')
  };

  function renderDoc(sections, container){
    container.innerHTML = sections.map(([h, p]) => `<h3>${h}</h3><p>${p}</p>`).join('');
  }

  function render(){
    const d = dict[lang];
    document.documentElement.lang = lang;
    el.backText.textContent = d.back;
    el.pageTitle.textContent = d.title;
    el.pageSub.textContent = d.sub;
    el.tabPrivacy.textContent = d.tabPrivacy;
    el.tabTerms.textContent = d.tabTerms;
    renderDoc(d.privacy, el.privacySection);
    renderDoc(d.terms, el.termsSection);
    el.footerHome.textContent = d.home;
    el.footerFaq.textContent = d.faq;
    el.footerDownload.textContent = d.download;
    el.footerBot.textContent = d.bot;
    el.footerCopy.textContent = d.copy;
    document.querySelectorAll('#langSwitch button').forEach(b=> b.classList.toggle('active', b.dataset.lang === lang));
    el.tabPrivacy.classList.toggle('active', doc === 'privacy');
    el.tabTerms.classList.toggle('active', doc === 'terms');
    el.privacySection.classList.toggle('active', doc === 'privacy');
    el.termsSection.classList.toggle('active', doc === 'terms');
  }

  document.querySelectorAll('#langSwitch button').forEach(b=>{
    b.addEventListener('click', ()=>{ lang = b.dataset.lang; localStorage.setItem(LANG_KEY, lang); render(); });
  });
  document.querySelectorAll('.doc-tab').forEach(b=>{
    b.addEventListener('click', ()=>{ doc = b.dataset.doc; localStorage.setItem(DOC_KEY, doc); render(); });
  });

  render();

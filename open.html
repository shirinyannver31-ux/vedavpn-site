<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VedaVPN — Открытие приложения</title>
<style>
  :root{
    --bg:#0a0f0d; --panel:#101713; --line:#1e2b24;
    --signal:#39ff9e; --signal-dim:rgba(57,255,158,0.35);
    --text:#eafff1; --muted:#8aa398;
    --warn:#ff9e39; --warn-dim:rgba(255,158,57,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
  }
  .wrap{
    min-height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:32px 24px;
    gap:18px;
  }
  .spinner{
    width:40px; height:40px;
    border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--signal);
    animation:spin 0.8s linear infinite;
  }
  .spinner.warn{
    border-top-color:var(--warn);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{
    font-size:17px; font-weight:600; margin:0;
    color:var(--text);
  }
  h1.warn{ color:var(--warn); }
  p{
    font-size:14px; color:var(--muted);
    margin:0; line-height:1.5; max-width:320px;
  }
  .fallback-btn{
    display:none;
    margin-top:8px;
    padding:12px 22px;
    border-radius:12px;
    border:1px solid var(--signal-dim);
    background:rgba(57,255,158,0.08);
    color:var(--signal);
    font-weight:600;
    font-size:14px;
    text-decoration:none;
  }
  .fallback-btn.show{ display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Открываем приложение…</h1>
  <p id="hint">Если приложение не установлено, вы будете автоматически перенаправлены в магазин приложений.</p>
  <a href="#" class="fallback-btn" id="fallbackBtn">Перейти в магазин приложений</a>
</div>

<script>
(function(){
  // Expected query params:
  //   app    = "incy"  (happ has been removed from this flow)
  //   device = "android" | "ios"   -- the device the user picked in the bot
  //   link   = the VPN subscription URL to import (URL-encoded)
  //   lang   = "hy" | "ru"         -- current bot language, for this page's text
  var params = new URLSearchParams(window.location.search);
  var app = params.get('app');
  var selectedDevice = params.get('device') === 'ios' ? 'ios' : 'android';
  var subUrl = params.get('link') || '';
  var lang = params.get('lang') === 'hy' ? 'hy' : 'ru';

  var TEXTS = {
    ru: {
      opening: 'Открываем приложение…',
      hint: 'Если приложение не установлено, вы будете автоматически перенаправлены в магазин приложений.',
      notFoundTitle: 'Приложение не найдено',
      notFoundHint: 'Переходим в магазин приложений…',
      fallbackBtn: 'Перейти в магазин приложений',
      invalidTitle: 'Ссылка недействительна',
      invalidHint: 'Откройте эту страницу из бота или сайта VedaVPN.',
      openedTitle: 'Ссылка скопирована',
      openedHint: 'Если INCY не открылось само — установите его и вставьте ссылку вручную (кнопкой ниже или из буфера обмена).',
      wrongDeviceTitle: 'Неверный тип телефона',
      // shown when the phone actually is `actual`, but the user picked the other one in the bot
      wrongDevice: {
        android: 'Похоже, вы выбрали iPhone, но пользуетесь Android. Пожалуйста, вернитесь в бот и выберите ANDROID, затем снова нажмите «Открыть в INCY».',
        ios: 'Похоже, вы выбрали Android, но пользуетесь iPhone. Пожалуйста, вернитесь в бот и выберите IPHONE, затем снова нажмите «Открыть в INCY».'
      }
    },
    hy: {
      opening: 'Բացվում է հավելվածը…',
      hint: 'Եթե հավելվածը տեղադրված չէ, դուք ավտոմատ կուղղորդվեք հավելվածների խանութ։',
      notFoundTitle: 'Հավելվածը չի գտնվել',
      notFoundHint: 'Անցում ենք կատարում հավելվածների խանութ…',
      fallbackBtn: 'Անցնել հավելվածների խանութ',
      invalidTitle: 'Հղումն անվավեր է',
      invalidHint: 'Բացեք այս էջը VedaVPN բոտից կամ կայքից։',
      openedTitle: 'Հղումը պատճենվեց',
      openedHint: 'Եթե INCY-ն ինքն իրեն չբացվեց՝ տեղադրեք հավելվածը և հղումը մուտքագրեք ձեռքով (ներքևի կոճակով կամ clipboard-ից)։',
      wrongDeviceTitle: 'Հեռախոսի սխալ տեսակ',
      wrongDevice: {
        android: 'Կարծես ընտրել եք iPhone, բայց օգտագործում եք Android։ Խնդրում ենք վերադառնալ բոտ, ընտրել ANDROID, և կրկին սեղմել «Բացել INCY-ում»։',
        ios: 'Կարծես ընտրել եք Android, բայց օգտագործում եք iPhone։ Խնդրում ենք վերադառնալ բոտ, ընտրել IPHONE, և կրկին սեղմել «Բացել INCY-ում»։'
      }
    }
  };
  var T = TEXTS[lang];

  // Confirmed correct format:
  //   INCY: incy://add/<raw url> -- already confirmed working as-is.
  var deepLinkBuilders = {
    incy: function(url){ return 'incy://add/' + url; }
  };
  var storeLinks = {
    incy: {
      android: 'https://play.google.com/store/apps/details?id=llc.itdev.incy',
      ios: 'https://apps.apple.com/ru/app/incy/id6756943388'
    }
  };

  var titleEl = document.getElementById('title');
  var hintEl = document.getElementById('hint');
  var spinnerEl = document.getElementById('spinner');
  var fallbackBtn = document.getElementById('fallbackBtn');

  var storeUrl = (storeLinks[app] || {})[selectedDevice];

  if(!app || !deepLinkBuilders[app] || !storeUrl){
    // Missing/unknown params — nothing sensible to do.
    spinnerEl.style.display = 'none';
    titleEl.textContent = T.invalidTitle;
    hintEl.textContent = T.invalidHint;
    return;
  }

  // Detect the phone's real OS from the browser itself. This is what
  // lets us catch a mismatch between what was picked in the bot
  // (selectedDevice) and what the person is actually holding.
  function detectActualDevice(){
    var ua = (navigator.userAgent || navigator.vendor || window.opera || '');
    if(/android/i.test(ua)) return 'android';
    if(/iphone|ipad|ipod/i.test(ua)) return 'ios';
    return null; // can't tell (e.g. desktop browser) -- don't block in that case
  }
  var actualDevice = detectActualDevice();

  if(actualDevice && actualDevice !== selectedDevice){
    // Wrong device selected in the bot: never open/redirect anything,
    // just tell the person to go back and pick the right one. This is
    // what guarantees that picking Android always opens the Android
    // app and picking iPhone always opens the iOS app -- we simply
    // refuse to proceed at all when there's a mismatch.
    spinnerEl.style.display = 'none';
    spinnerEl.classList.add('warn');
    titleEl.classList.add('warn');
    titleEl.textContent = T.wrongDeviceTitle;
    hintEl.textContent = T.wrongDevice[actualDevice];
    return;
  }

  titleEl.textContent = T.opening;
  hintEl.textContent = T.hint;

  // Show the manual store fallback link right away too, but — unlike
  // before — we never auto-navigate to it. In-app browsers (Telegram's
  // webview in particular) frequently don't fire `visibilitychange` even
  // when the incy:// deep link successfully opened the app, so a
  // timeout-based "app not found, redirecting to store" check was
  // yanking people to the App/Play Store even though INCY had actually
  // opened and imported the link just fine. Now that navigation only
  // happens if the person taps the button themselves.
  fallbackBtn.href = storeUrl;
  fallbackBtn.textContent = T.fallbackBtn;
  fallbackBtn.classList.add('show');

  function copyToClipboardSilently(text){
    try{ navigator.clipboard && navigator.clipboard.writeText(text).catch(function(){}); }catch(e){}
  }
  if(subUrl){ copyToClipboardSilently(subUrl); }

  var deepLink = deepLinkBuilders[app](subUrl);
  window.location.href = deepLink;

  // After a short delay, stop showing the spinner and update the hint to
  // say "tap below if it didn't open" — but don't move the page anywhere
  // on our own. The VPN link is also already copied to the clipboard as
  // a backup in case INCY needs it pasted in manually.
  setTimeout(function(){
    spinnerEl.style.display = 'none';
    titleEl.textContent = T.openedTitle;
    hintEl.textContent = T.openedHint;
  }, 1500);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FAQ — VedaVPN</title>
<meta property="og:title" content="VedaVPN — FAQ">
<meta property="og:description" content="Frequently asked questions about VedaVPN.">
<meta property="og:image" content="https://vedavpn.lol/og-image.png">
<meta property="og:url" content="https://vedavpn.lol/faq.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1A; --panel:#10182B; --panel-2:#131D33; --line:#212B42;
    --signal:#39FF9E; --signal-rgb:57,255,158; --signal-dim:#1D8F60; --accent:#6EA8FE;
    --text:#ECEFF4; --muted:#838DA3; --bg-glow:rgba(var(--signal-rgb),0.07);
    --bg-lines:rgba(255,255,255,0.015); --shadow:rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --bg:#F3F6FB; --panel:#FFFFFF; --panel-2:#FFFFFF; --line:#DDE4EF;
    --signal:#17A968; --signal-rgb:23,169,104; --signal-dim:#0E8A54; --accent:#2B6CE0;
    --text:#101623; --muted:#6A7488; --bg-glow:rgba(23,169,104,0.08);
    --bg-lines:rgba(16,22,35,0.03); --shadow:rgba(16,22,35,0.10);
  }
  :root[data-palette="blue"]{ --signal:#4CC2FF; --signal-rgb:76,194,255; --signal-dim:#1E6FA8; --accent:#7CC7FF; --bg-glow:rgba(76,194,255,0.08); }
  :root[data-theme="light"][data-palette="blue"]{ --signal:#0E7FC4; --signal-rgb:14,127,196; --signal-dim:#0B5F94; --accent:#1C6FA6; --bg-glow:rgba(14,127,196,0.08); }
  :root[data-palette="purple"]{ --signal:#B98CFF; --signal-rgb:185,140,255; --signal-dim:#7A54B8; --accent:#C9A8FF; --bg-glow:rgba(185,140,255,0.08); }
  :root[data-theme="light"][data-palette="purple"]{ --signal:#7B4FD6; --signal-rgb:123,79,214; --signal-dim:#5C3AA3; --accent:#8A5FE0; --bg-glow:rgba(123,79,214,0.08); }
  :root[data-palette="red"]{ --signal:#FF5C77; --signal-rgb:255,92,119; --signal-dim:#B8384F; --accent:#FF8FA3; --bg-glow:rgba(255,92,119,0.08); }
  :root[data-theme="light"][data-palette="red"]{ --signal:#D6285A; --signal-rgb:214,40,90; --signal-dim:#A31D44; --accent:#E0507A; --bg-glow:rgba(214,40,90,0.08); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh;
    transition:background-color .25s ease, color .25s ease;
    background-image:
      radial-gradient(circle at 50% 0%, var(--bg-glow), transparent 55%),
      repeating-linear-gradient(0deg, var(--bg-lines) 0px, var(--bg-lines) 1px, transparent 1px, transparent 32px);
  }
  .wrap{ max-width:460px; margin:0 auto; min-height:100vh; padding:28px 20px 60px; }
  .brand{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.01em; margin:0; }
  .brand span{ color:var(--signal); }
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .top-row-left{ display:flex; align-items:center; gap:10px; }
  .logo-mark-sm{ width:34px; height:34px; border-radius:9px; overflow:hidden; flex-shrink:0; border:1px solid var(--line); }
  .logo-mark-sm img{ width:100%; height:100%; object-fit:cover; display:block; }
  .top-row-right{ display:flex; align-items:center; gap:8px; }
  .lang-switch{ display:flex; gap:4px; font-family:'IBM Plex Mono', monospace; font-size:11px; }
  .lang-switch button{ background:transparent; border:1px solid var(--line); color:var(--muted); padding:4px 8px; border-radius:6px; cursor:pointer; }
  .lang-switch button.active{ color:var(--signal); border-color:var(--signal-dim); }
  .theme-toggle{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .theme-toggle:active{ transform:scale(0.92); }
  .theme-toggle svg{ width:16px; height:16px; }
  .theme-toggle .icon-moon{ display:block; } .theme-toggle .icon-sun{ display:none; }
  :root[data-theme="light"] .theme-toggle .icon-moon{ display:none; } :root[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  .palette-switch{ display:flex; align-items:center; gap:6px; }
  .palette-dot{ width:18px; height:18px; border-radius:50%; border:2px solid var(--line); background:var(--dot); padding:0; cursor:pointer; }
  .palette-dot.active{ border-color:var(--text); box-shadow:0 0 0 2px var(--bg); }
  .back-btn{ display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--line); color:var(--text); font-family:'Inter', sans-serif; font-weight:500; font-size:14px; padding:8px 14px; border-radius:10px; cursor:pointer; text-decoration:none; margin-bottom:20px; }
  .back-btn:hover{ border-color:var(--signal-dim); }
  .page-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:22px; margin:0 0 6px; }
  .page-sub{ color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 26px; }
  .faq-item{ background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden; }
  .faq-q{ width:100%; text-align:left; background:transparent; border:none; color:var(--text); font-family:'Inter', sans-serif; font-weight:500; font-size:13.5px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .faq-q .chev{ color:var(--muted); transition:transform .2s ease; flex-shrink:0; }
  .faq-item.open .faq-q .chev{ transform:rotate(180deg); }
  .faq-a{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .faq-item.open .faq-a{ max-height:400px; }
  .faq-a p{ margin:0; padding:0 16px 14px; font-size:13px; color:var(--muted); line-height:1.6; }
  .site-footer{ margin-top:36px; padding-top:22px; border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .footer-links{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .footer-links a{ color:var(--muted); font-size:13px; font-weight:500; text-decoration:none; }
  .footer-links a:hover{ color:var(--signal); }
  .footer-copy{ font-size:11px; color:var(--muted); margin:0; font-family:'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div class="top-row-left">
      <div class="logo-mark-sm"><img src="veda-logo.png" alt="VedaVPN"></div>
      <h1 class="brand">Veda<span>VPN</span></h1>
    </div>
    <div class="top-row-right">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="ru">RU</button>
        <button data-lang="hy">HY</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <div class="palette-switch" id="paletteSwitch">
        <button class="palette-dot" data-palette="green" style="--dot:#39FF9E" aria-label="Green" type="button"></button>
        <button class="palette-dot" data-palette="blue" style="--dot:#4CC2FF" aria-label="Blue" type="button"></button>
        <button class="palette-dot" data-palette="purple" style="--dot:#B98CFF" aria-label="Purple" type="button"></button>
        <button class="palette-dot" data-palette="red" style="--dot:#FF5C77" aria-label="Red" type="button"></button>
      </div>
    </div>
  </div>

  <a class="back-btn" href="index.html" id="backBtn">← <span id="backText">Назад</span></a>
  <h2 class="page-title" id="pageTitle"></h2>
  <p class="page-sub" id="pageSub"></p>
  <div id="faqList"></div>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="index.html" id="footerHome"></a>
      <a href="download.html" id="footerDownload"></a>
      <a href="privacy-terms.html" id="footerLegal"></a>
      <a href="https://t.me/vedavpn_bot" target="_blank" rel="noopener" id="footerBot"></a>
    </div>
    <p class="footer-copy" id="footerCopy"></p>
  </footer>
</div>

<script>
(function(){
  // ---- Theme ----
  (function initTheme(){
    const THEME_KEY = 'vedavpn_theme';
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); }
    function currentTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      if(saved === 'light' || saved === 'dark') return saved;
      return mq.matches ? 'light' : 'dark';
    }
    applyTheme(currentTheme());
    mq.addEventListener('change', (e)=>{ if(!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'light' : 'dark'); });
    document.getElementById('themeToggle').addEventListener('click', ()=>{
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    });
  })();

  // ---- Palette ----
  (function initPalette(){
    const PALETTE_KEY = 'vedavpn_palette';
    const dots = document.querySelectorAll('.palette-dot');
    function applyPalette(p){
      document.documentElement.setAttribute('data-palette', p);
      dots.forEach(d => d.classList.toggle('active', d.dataset.palette === p));
    }
    applyPalette(localStorage.getItem(PALETTE_KEY) || 'green');
    dots.forEach(d => d.addEventListener('click', ()=>{
      applyPalette(d.dataset.palette);
      localStorage.setItem(PALETTE_KEY, d.dataset.palette);
    }));
  })();

  // ---- Content ----
  const dict = {
    ru: {
      back:'Назад', title:'❓ Частые вопросы', sub:'Ответы на самые популярные вопросы о VedaVPN.',
      home:'Главная', download:'Как подключиться', legal:'Политика и условия', bot:'Бот поддержки',
      copy:'© 2026 VedaVPN',
      faq:[
        { q:'Ссылка одна на всех?', a:'Да, сейчас все пользователи используют одну общую VPN ссылку. Индивидуальные ссылки появятся позже.' },
        { q:'Нужно ли платить?', a:'На данный момент VPN бесплатный. Следите за новостями в канале — там появятся все обновления.' },
        { q:'Ссылка перестала работать, что делать?', a:'Проверьте актуальную ссылку в этом же боте или напишите в поддержку через бот @vedavpn_bot.' },
        { q:'Какое приложение лучше использовать?', a:'Мы рекомендуем Happ или INCY — оба поддерживают эту ссылку и просты в настройке.' },
        { q:'Вы храните логи моей активности?', a:'Нет, VedaVPN работает по политике no-logs — мы не записываем и не храним данные о вашей активности в сети.' },
        { q:'Можно ли использовать VPN на нескольких устройствах?', a:'Да, ссылку можно добавить в приложение на любом количестве устройств.' }
      ]
    },
    hy: {
      back:'Հետ', title:'❓ Հաճախակի հարցեր', sub:'Պատասխաններ VedaVPN-ի մասին ամենատարածված հարցերին։',
      home:'Գլխավոր', download:'Ինչպես միանալ', legal:'Քաղաքականություն և պայմաններ', bot:'Աջակցության բոտ',
      copy:'© 2026 VedaVPN',
      faq:[
        { q:'Բոլորի համար նույն հղու՞մն է։', a:'Այո, ներկայումս բոլոր օգտատերերն օգտագործում են մեկ ընդհանուր VPN հղում։ Անհատական հղումները կհայտնվեն ավելի ուշ։' },
        { q:'Պե՞տք է վճարել։', a:'Այս պահին VPN-ն անվճար է։ Հետևեք ալիքի նորություններին՝ բոլոր թարմացումները այնտեղ կհայտնվեն։' },
        { q:'Հղումն այլևս չի աշխատում, ի՞նչ անել։', a:'Ստուգեք ընթացիկ հղումը նույն բոտում կամ գրեք աջակցությանը @vedavpn_bot բոտի միջոցով։' },
        { q:'Ո՞ր հավելվածն է ավելի լավ օգտագործել։', a:'Խորհուրդ ենք տալիս Happ կամ INCY. երկուսն էլ աջակցում են այս հղումը և հեշտ են կարգավորել։' },
        { q:'Դուք պահո՞ւմ եք իմ ակտիվության logs-ը։', a:'Ոչ, VedaVPN-ն աշխատում է no-logs քաղաքականությամբ. մենք չենք գրանցում և չենք պահում ձեր ցանցային ակտիվության տվյալները։' },
        { q:'Կարո՞ղ եմ օգտագործել VPN-ը մի քանի սարքի վրա։', a:'Այո, հղումը կարող եք ավելացնել ցանկացած քանակի սարքերի հավելվածում։' }
      ]
    },
    en: {
      back:'Back', title:'❓ Frequently asked questions', sub:'Answers to the most common questions about VedaVPN.',
      home:'Home', download:'How to connect', legal:'Privacy & Terms', bot:'Support bot',
      copy:'© 2026 VedaVPN',
      faq:[
        { q:'Is there one link for everyone?', a:'Yes, right now all users share one common VPN link. Individual links will be added later.' },
        { q:'Do I need to pay?', a:'VPN is currently free. Follow the channel for news — all updates will be posted there.' },
        { q:'The link stopped working, what do I do?', a:'Check the current link in the same bot, or contact support via @vedavpn_bot.' },
        { q:'Which app should I use?', a:'We recommend Happ or INCY — both support this link and are easy to set up.' },
        { q:'Do you log my activity?', a:'No, VedaVPN follows a no-logs policy — we do not record or store data about your network activity.' },
        { q:'Can I use the VPN on multiple devices?', a:'Yes, you can add the link to the app on any number of devices.' }
      ]
    }
  };

  const LANG_KEY = 'vedavpn_lang';
  let lang = localStorage.getItem(LANG_KEY) || 'ru';
  if(!dict[lang]) lang = 'ru';

  const el = {
    backText: document.getElementById('backText'),
    pageTitle: document.getElementById('pageTitle'),
    pageSub: document.getElementById('pageSub'),
    faqList: document.getElementById('faqList'),
    footerHome: document.getElementById('footerHome'),
    footerDownload: document.getElementById('footerDownload'),
    footerLegal: document.getElementById('footerLegal'),
    footerBot: document.getElementById('footerBot'),
    footerCopy: document.getElementById('footerCopy')
  };

  function renderFaq(list){
    el.faqList.innerHTML = list.map((item, i) => `
      <div class="faq-item" data-idx="${i}">
        <button class="faq-q">${item.q}<span class="chev">▾</span></button>
        <div class="faq-a"><p>${item.a}</p></div>
      </div>
    `).join('');
    el.faqList.querySelectorAll('.faq-item').forEach(node=>{
      node.querySelector('.faq-q').addEventListener('click', ()=> node.classList.toggle('open'));
    });
  }

  function render(){
    const d = dict[lang];
    document.documentElement.lang = lang;
    el.backText.textContent = d.back;
    el.pageTitle.textContent = d.title;
    el.pageSub.textContent = d.sub;
    el.footerHome.textContent = d.home;
    el.footerDownload.textContent = d.download;
    el.footerLegal.textContent = d.legal;
    el.footerBot.textContent = d.bot;
    el.footerCopy.textContent = d.copy;
    renderFaq(d.faq);
    document.querySelectorAll('#langSwitch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang === lang);
    });
  }

  document.querySelectorAll('#langSwitch button').forEach(b=>{
    b.addEventListener('click', ()=>{
      lang = b.dataset.lang;
      localStorage.setItem(LANG_KEY, lang);
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
